<!-- METADATA
  @style: luxury
  @complexity: 4
  @animation-deps: none
  @responsive: true
  @description: Luxury/premium hero with CSS perspective transforms for depth, parallax layers responding to mouse movement (vanilla JS), elegant typography, dark theme.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero - 3D Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #0c0c0c;
    --color-text: #f5f0eb;
    --color-text-muted: rgba(245,240,235,0.4);
    --color-gold: #c9a96e;
    --color-gold-light: #e2c992;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    height: 100vh;
    min-height: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1200px;
    cursor: default;
  }

  /* Background layers */
  .hero__layer {
    position: absolute;
    inset: -60px;
    transition: transform 0.15s ease-out;
    will-change: transform;
  }

  .hero__layer--bg {
    z-index: 0;
  }

  .hero__grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  .hero__vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, var(--color-bg) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Decorative shapes */
  .hero__layer--shapes {
    z-index: 2;
  }

  .hero__shape {
    position: absolute;
    border: 1px solid rgba(201,169,110,0.12);
  }

  .hero__shape--ring1 {
    width: 500px;
    height: 500px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .hero__shape--ring2 {
    width: 360px;
    height: 360px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-color: rgba(201,169,110,0.08);
  }

  .hero__shape--line1 {
    width: 200px;
    height: 0;
    border-bottom: 1px solid rgba(201,169,110,0.1);
    top: 30%;
    left: 10%;
    transform: rotate(-15deg);
  }

  .hero__shape--line2 {
    width: 160px;
    height: 0;
    border-bottom: 1px solid rgba(201,169,110,0.08);
    bottom: 25%;
    right: 12%;
    transform: rotate(20deg);
  }

  .hero__shape--diamond {
    width: 60px;
    height: 60px;
    border-color: rgba(201,169,110,0.15);
    top: 20%;
    right: 22%;
    transform: rotate(45deg);
  }

  .hero__shape--dot {
    width: 4px;
    height: 4px;
    border: none;
    border-radius: 50%;
    background: var(--color-gold);
    opacity: 0.3;
  }

  .hero__shape--dot1 { top: 35%; left: 18%; }
  .hero__shape--dot2 { bottom: 30%; right: 25%; }
  .hero__shape--dot3 { top: 60%; left: 12%; }

  /* Content layer */
  .hero__layer--content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 32px;
  }

  .hero__overline {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--color-gold);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .hero__overline-line {
    width: 40px;
    height: 1px;
    background: var(--color-gold);
    opacity: 0.4;
  }

  .hero__headline {
    font-family: var(--font-serif);
    font-size: clamp(44px, 8vw, 110px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
    max-width: 900px;
  }

  .hero__headline em {
    font-style: italic;
    color: var(--color-gold);
  }

  .hero__desc {
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.8;
    color: var(--color-text-muted);
    max-width: 440px;
    font-weight: 300;
    margin-bottom: 48px;
  }

  .hero__cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--color-gold);
    text-decoration: none;
    padding: 16px 0;
    position: relative;
    transition: color 0.3s ease;
  }

  .hero__cta::after {
    content: '';
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--color-gold);
    opacity: 0.3;
    transform: scaleX(1);
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform-origin: left;
  }

  .hero__cta:hover {
    color: var(--color-gold-light);
  }

  .hero__cta:hover::after {
    opacity: 0.6;
    transform: scaleX(1.05);
  }

  .hero__cta svg {
    transition: transform 0.3s ease;
  }

  .hero__cta:hover svg {
    transform: translateX(4px);
  }

  /* Corner accents */
  .hero__corner {
    position: absolute;
    z-index: 3;
    color: var(--color-text-muted);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.1em;
  }

  .hero__corner--tl {
    top: 40px;
    left: 48px;
  }

  .hero__corner--br {
    bottom: 40px;
    right: 48px;
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .hero__shape--ring1 { width: 380px; height: 380px; }
    .hero__shape--ring2 { width: 260px; height: 260px; }
  }

  @media (max-width: 768px) {
    .hero__shape--ring1 { width: 280px; height: 280px; }
    .hero__shape--ring2 { width: 200px; height: 200px; }
    .hero__shape--line1,
    .hero__shape--line2,
    .hero__shape--diamond { display: none; }
    .hero__corner { display: none; }
    .hero__overline { margin-bottom: 28px; }
    .hero__headline { margin-bottom: 24px; }
    .hero__desc { margin-bottom: 36px; }
  }

  @media (max-width: 375px) {
    .hero__layer--content {
      padding: 0 20px;
    }
    .hero__overline {
      font-size: 10px;
    }
  }

  /* Entrance animations */
  .hero__overline,
  .hero__headline,
  .hero__desc,
  .hero__cta,
  .hero__corner {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease forwards;
  }

  .hero__overline { animation-delay: 0.2s; }
  .hero__headline { animation-delay: 0.4s; }
  .hero__desc     { animation-delay: 0.6s; }
  .hero__cta      { animation-delay: 0.8s; }
  .hero__corner--tl { animation-delay: 1.0s; }
  .hero__corner--br { animation-delay: 1.1s; }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <!-- Background layer -->
  <div class="hero__layer hero__layer--bg" data-depth="0.02">
    <div class="hero__grid"></div>
  </div>

  <div class="hero__vignette"></div>

  <!-- Shapes layer -->
  <div class="hero__layer hero__layer--shapes" data-depth="0.04">
    <div class="hero__shape hero__shape--ring1"></div>
    <div class="hero__shape hero__shape--ring2"></div>
    <div class="hero__shape hero__shape--line1"></div>
    <div class="hero__shape hero__shape--line2"></div>
    <div class="hero__shape hero__shape--diamond"></div>
    <div class="hero__shape hero__shape--dot hero__shape--dot1"></div>
    <div class="hero__shape hero__shape--dot hero__shape--dot2"></div>
    <div class="hero__shape hero__shape--dot hero__shape--dot3"></div>
  </div>

  <!-- Content -->
  <div class="hero__layer--content" data-depth="0.06">
    <p class="hero__overline">
      <span class="hero__overline-line"></span>
      Atelier since 2012
      <span class="hero__overline-line"></span>
    </p>

    <h1 class="hero__headline">The art of<br><em>timeless</em> design</h1>

    <p class="hero__desc">
      We create bespoke digital experiences where luxury meets precision. Every detail, intentional. Every moment, memorable.
    </p>

    <a href="#" class="hero__cta">
      Discover our collection
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10m-4-4l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <span class="hero__corner hero__corner--tl">52.5200 N / 13.4050 E</span>
  <span class="hero__corner hero__corner--br">Est. MMXII</span>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const hero = document.getElementById('hero');
    const layers = hero.querySelectorAll('[data-depth]');

    // Only enable parallax on non-touch devices
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (!isTouch) {
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      hero.addEventListener('mousemove', (e) => {
        const rect = hero.getBoundingClientRect();
        targetX = (e.clientX - rect.left - rect.width / 2) / rect.width;
        targetY = (e.clientY - rect.top - rect.height / 2) / rect.height;
      });

      function animate() {
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;

        layers.forEach((layer) => {
          const depth = parseFloat(layer.dataset.depth);
          const moveX = currentX * depth * 100;
          const moveY = currentY * depth * 100;
          const rotateX = currentY * depth * -8;
          const rotateY = currentX * depth * 8;

          layer.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        requestAnimationFrame(animate);
      }

      animate();
    }
  });
</script>
</body>
</html>
