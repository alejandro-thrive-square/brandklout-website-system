<!-- METADATA
  @style: bold-startup
  @complexity: 3
  @animation-deps: gsap
  @responsive: true
  @description: Full-width section with animated gradient background, large headline, CTA with hover glow, floating shapes via GSAP
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Full Width Gradient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font-main: 'Space Grotesk', sans-serif;
  }

  body {
    font-family: var(--font-main);
    -webkit-font-smoothing: antialiased;
    background: #0a0a0a;
  }

  .cta {
    position: relative;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 120px 24px;
  }

  .cta__bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 25%, #ec4899 50%, #f43f5e 75%, #6366f1 100%);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  .cta__noise {
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.3;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* Floating shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    pointer-events: none;
    will-change: transform;
  }

  .shape--1 {
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.2);
    top: -80px;
    left: -80px;
  }

  .shape--2 {
    width: 200px;
    height: 200px;
    background: rgba(255,255,255,0.15);
    bottom: -60px;
    right: 10%;
  }

  .shape--3 {
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.2);
    top: 30%;
    right: -40px;
    border-radius: 24px;
    transform: rotate(45deg);
  }

  .shape--4 {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.1);
    bottom: 25%;
    left: 15%;
    border-radius: 16px;
    transform: rotate(30deg);
  }

  .shape--5 {
    width: 160px;
    height: 160px;
    background: rgba(255,255,255,0.08);
    top: 15%;
    left: 55%;
  }

  .cta__content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 720px;
  }

  .cta__headline {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .cta__text {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: rgba(255,255,255,0.85);
    line-height: 1.6;
    margin-bottom: 40px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  .cta__actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .cta__btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 36px;
    border-radius: 14px;
    font-family: var(--font-main);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
  }

  .cta__btn--primary {
    background: #ffffff;
    color: #1e1b4b;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .cta__btn--primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1);
  }

  .cta__btn--secondary {
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    border: 1.5px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);
  }

  .cta__btn--secondary:hover {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.5);
    transform: translateY(-2px);
  }

  .cta__btn svg {
    width: 18px;
    height: 18px;
  }

  .cta__note {
    margin-top: 20px;
    font-size: 0.8125rem;
    color: rgba(255,255,255,0.6);
  }

  @media (max-width: 640px) {
    .cta { padding: 80px 20px; min-height: 500px; }
    .cta__actions { flex-direction: column; align-items: center; }
    .cta__btn { width: 100%; max-width: 300px; justify-content: center; }
  }
</style>
</head>
<body>
<section class="cta">
  <div class="cta__bg"></div>
  <div class="cta__noise"></div>

  <div class="shape shape--1"></div>
  <div class="shape shape--2"></div>
  <div class="shape shape--3"></div>
  <div class="shape shape--4"></div>
  <div class="shape shape--5"></div>

  <div class="cta__content">
    <h2 class="cta__headline">Ready to build something amazing?</h2>
    <p class="cta__text">Join thousands of teams who are already shipping faster, collaborating better, and delighting their customers.</p>
    <div class="cta__actions">
      <a href="#" class="cta__btn cta__btn--primary">
        Start free trial
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <a href="#" class="cta__btn cta__btn--secondary">Book a demo</a>
    </div>
    <p class="cta__note">No credit card required. 14-day free trial.</p>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
  const shapes = document.querySelectorAll('.shape');

  shapes.forEach((shape, i) => {
    const duration = 4 + i * 1.5;
    const xRange = 20 + i * 10;
    const yRange = 15 + i * 8;

    gsap.to(shape, {
      x: `random(-${xRange}, ${xRange})`,
      y: `random(-${yRange}, ${yRange})`,
      rotation: `random(-15, 15)`,
      duration: duration,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true,
      delay: i * 0.3
    });
  });

  // Subtle parallax on mouse move
  const content = document.querySelector('.cta__content');
  document.querySelector('.cta').addEventListener('mousemove', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    gsap.to(content, { x: x * 10, y: y * 10, duration: 0.5, ease: 'power2.out' });
  });
})();
</script>
</body>
</html>
