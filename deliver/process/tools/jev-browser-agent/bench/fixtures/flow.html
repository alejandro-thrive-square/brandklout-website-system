<!doctype html><meta charset="utf-8"><title>Dashboard · Google Reviews</title>
<script src="common.js"></script>
<style>
  body{margin:0;font:15px system-ui}
  header{display:flex;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid #ddd}
  header .sp{flex:1}
  section{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(3,200px);gap:14px}
  .card{border:1px solid #ddd;border-radius:10px;padding:12px;cursor:pointer}
  .thumb{height:70px;background:#eef;border-radius:6px;margin-bottom:6px}
  iframe{border:0;width:100%;height:690px}
  [hidden]{display:none!important}
</style>
<header><strong>Google Reviews</strong><span class="sp"></span>
  <button onclick="report('flow','upgrade')">Upgrade</button>
  <button id="close" hidden onclick="report('flow','close');location.reload()">Close</button></header>
<section id="list"><h2>Your widgets</h2><p>22 of 50 widgets used.</p>
  <button id="create">Create widget</button></section>
<section id="gallery" hidden><h2>Choose a template</h2><div class="grid"></div></section>
<iframe id="editor" hidden></iframe>
<script>
  document.getElementById('create').onclick = () => {
    report('flow', 'create');
    list.hidden = true; gallery.hidden = false;
  };
  for (const name of ['Slider', 'Grid', 'Carousel', 'Masonry', 'List', 'Badge']) {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="thumb"></div><div>${name}</div>`;
    c.addEventListener('click', () => {
      report('flow', 'template', name);
      gallery.hidden = true; document.getElementById('close').hidden = false;
      const f = document.getElementById('editor');
      f.src = 'http://localhost:8802/flow-editor.html?t=' + name; f.hidden = false;
    });
    gallery.querySelector('.grid').append(c);
  }
</script>
