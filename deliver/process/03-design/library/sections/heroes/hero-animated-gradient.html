<!-- METADATA
  @style: bold-startup
  @complexity: 4
  @animation-deps: gsap
  @responsive: true
  @description: Bold startup hero with animated mesh gradient background, large headline, bright CTA, and floating UI element cards animated with GSAP.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero - Animated Gradient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #0a0a0a;
    --color-text: #ffffff;
    --color-text-secondary: rgba(255,255,255,0.6);
    --color-cta: #22d3ee;
    --color-cta-dark: #06b6d4;
    --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 60px 24px;
  }

  /* Animated mesh gradient */
  .hero__mesh {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .hero__mesh-layer {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
  }

  .hero__mesh-layer--1 {
    width: 50vw;
    height: 50vw;
    max-width: 800px;
    max-height: 800px;
    background: #8b5cf6;
    opacity: 0.35;
    top: -10%;
    left: -10%;
    animation: meshFloat1 10s ease-in-out infinite;
  }

  .hero__mesh-layer--2 {
    width: 40vw;
    height: 40vw;
    max-width: 600px;
    max-height: 600px;
    background: #ec4899;
    opacity: 0.3;
    top: 30%;
    right: -5%;
    animation: meshFloat2 12s ease-in-out infinite;
  }

  .hero__mesh-layer--3 {
    width: 45vw;
    height: 45vw;
    max-width: 700px;
    max-height: 700px;
    background: #06b6d4;
    opacity: 0.25;
    bottom: -15%;
    left: 25%;
    animation: meshFloat3 14s ease-in-out infinite;
  }

  .hero__mesh-layer--4 {
    width: 30vw;
    height: 30vw;
    max-width: 500px;
    max-height: 500px;
    background: #f97316;
    opacity: 0.2;
    top: 10%;
    right: 30%;
    animation: meshFloat4 11s ease-in-out infinite;
  }

  @keyframes meshFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(60px, 40px) scale(1.1); }
    66% { transform: translate(-30px, 60px) scale(0.95); }
  }
  @keyframes meshFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-50px, 30px) scale(1.05); }
    66% { transform: translate(40px, -40px) scale(0.9); }
  }
  @keyframes meshFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.08); }
    66% { transform: translate(-50px, -20px) scale(0.92); }
  }
  @keyframes meshFloat4 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 40px) scale(1.12); }
  }

  .hero__overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,10,0.4);
    z-index: 1;
  }

  .hero__content {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 820px;
  }

  .hero__pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 100px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    font-weight: 600;
    color: var(--color-cta);
    margin-bottom: 32px;
    backdrop-filter: blur(8px);
  }

  .hero__pill svg {
    flex-shrink: 0;
  }

  .hero__headline {
    font-size: clamp(40px, 7vw, 84px);
    font-weight: 800;
    line-height: 1.06;
    letter-spacing: -0.04em;
    margin-bottom: 24px;
  }

  .hero__sub {
    font-size: clamp(16px, 1.5vw, 20px);
    line-height: 1.7;
    color: var(--color-text-secondary);
    max-width: 540px;
    margin: 0 auto 40px;
    font-weight: 400;
  }

  .hero__cta-group {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .hero__btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-family);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    border: none;
  }

  .hero__btn--primary {
    background: var(--color-cta);
    color: #0a0a0a;
    box-shadow: 0 0 32px rgba(34,211,238,0.3);
  }

  .hero__btn--primary:hover {
    background: #67e8f9;
    transform: translateY(-2px);
    box-shadow: 0 0 48px rgba(34,211,238,0.45);
  }

  .hero__btn--outline {
    background: rgba(255,255,255,0.06);
    color: var(--color-text);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
  }

  .hero__btn--outline:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
  }

  /* Floating UI Cards */
  .hero__floaters {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .hero__float-card {
    position: absolute;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
  }

  .hero__float-card--1 {
    top: 18%;
    left: 6%;
  }

  .hero__float-card--2 {
    top: 24%;
    right: 4%;
  }

  .hero__float-card--3 {
    bottom: 22%;
    left: 8%;
  }

  .hero__float-card--4 {
    bottom: 16%;
    right: 6%;
  }

  .hero__float-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .hero__float-icon--purple { background: rgba(139,92,246,0.2); color: #a78bfa; }
  .hero__float-icon--pink   { background: rgba(236,72,153,0.2); color: #f472b6; }
  .hero__float-icon--cyan   { background: rgba(6,182,212,0.2);  color: #22d3ee; }
  .hero__float-icon--orange { background: rgba(249,115,22,0.2); color: #fb923c; }

  .hero__float-label {
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .hero__float-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-text);
    margin-top: 2px;
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .hero__float-card--1 { left: 2%; }
    .hero__float-card--2 { right: 2%; }
    .hero__float-card--3 { left: 2%; }
    .hero__float-card--4 { right: 2%; }
  }

  @media (max-width: 768px) {
    .hero__floaters {
      display: none;
    }
    .hero__headline {
      font-size: clamp(36px, 8vw, 56px);
    }
  }

  @media (max-width: 375px) {
    .hero {
      padding: 60px 16px;
    }
    .hero__cta-group {
      flex-direction: column;
    }
    .hero__btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero__mesh">
    <div class="hero__mesh-layer hero__mesh-layer--1"></div>
    <div class="hero__mesh-layer hero__mesh-layer--2"></div>
    <div class="hero__mesh-layer hero__mesh-layer--3"></div>
    <div class="hero__mesh-layer hero__mesh-layer--4"></div>
  </div>
  <div class="hero__overlay"></div>

  <div class="hero__floaters">
    <div class="hero__float-card hero__float-card--1">
      <div class="hero__float-icon hero__float-icon--purple">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
      </div>
      <div>
        <div class="hero__float-label">Components</div>
        <div class="hero__float-value">240+</div>
      </div>
    </div>

    <div class="hero__float-card hero__float-card--2">
      <div class="hero__float-icon hero__float-icon--pink">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3l2 4h4l-3.2 2.8L14 14l-4-2.5L6 14l1.2-4.2L4 7h4l2-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="hero__float-label">Satisfaction</div>
        <div class="hero__float-value">99.2%</div>
      </div>
    </div>

    <div class="hero__float-card hero__float-card--3">
      <div class="hero__float-icon hero__float-icon--cyan">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><polyline points="4,14 8,8 12,11 16,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="hero__float-label">Performance</div>
        <div class="hero__float-value">3x faster</div>
      </div>
    </div>

    <div class="hero__float-card hero__float-card--4">
      <div class="hero__float-icon hero__float-icon--orange">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="hero__float-label">Active users</div>
        <div class="hero__float-value">50K+</div>
      </div>
    </div>
  </div>

  <div class="hero__content">
    <div class="hero__pill">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 8l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Now in public beta
    </div>
    <h1 class="hero__headline">Ship products your users will love</h1>
    <p class="hero__sub">
      The modern platform for building, launching, and scaling digital products. From idea to production in record time.
    </p>
    <div class="hero__cta-group">
      <a href="#" class="hero__btn hero__btn--primary">
        Get started free
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m-4-4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="#" class="hero__btn hero__btn--outline">See how it works</a>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Entrance timeline
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl.from('.hero__pill', { opacity: 0, y: 20, duration: 0.6, delay: 0.2 })
      .from('.hero__headline', { opacity: 0, y: 30, duration: 0.7 }, '-=0.3')
      .from('.hero__sub', { opacity: 0, y: 20, duration: 0.6 }, '-=0.35')
      .from('.hero__cta-group', { opacity: 0, y: 20, duration: 0.5 }, '-=0.3');

    // Floating cards entrance + continuous animation
    const cards = document.querySelectorAll('.hero__float-card');
    cards.forEach((card, i) => {
      gsap.to(card, {
        opacity: 1,
        duration: 0.6,
        delay: 0.8 + i * 0.15,
        ease: 'power2.out',
      });

      // Continuous float
      gsap.to(card, {
        y: '+=12',
        duration: 2.5 + i * 0.5,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut',
        delay: i * 0.3,
      });

      gsap.to(card, {
        x: (i % 2 === 0 ? 1 : -1) * 6,
        duration: 3 + i * 0.4,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut',
        delay: i * 0.5,
      });
    });
  });
</script>
</body>
</html>
