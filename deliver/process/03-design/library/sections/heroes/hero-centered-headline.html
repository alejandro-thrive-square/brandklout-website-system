<!-- METADATA
  @style: minimal-portfolio
  @complexity: 3
  @animation-deps: gsap
  @responsive: true
  @description: Massive centered headline with word-by-word GSAP animation, gradient text, mouse-following gradient background, minimal CTA, and scroll indicator.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero - Centered Headline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #09090b;
    --color-text: #fafafa;
    --color-text-secondary: #a1a1aa;
    --color-accent-1: #6366f1;
    --color-accent-2: #ec4899;
    --color-accent-3: #8b5cf6;
    --font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    --container-max: 1100px;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 40px 24px;
  }

  .hero__gradient-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .hero__gradient-orb {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    transition: transform 0.3s ease-out;
  }

  .hero__gradient-orb--1 {
    background: var(--color-accent-1);
    top: 20%;
    left: 30%;
  }

  .hero__gradient-orb--2 {
    background: var(--color-accent-2);
    top: 40%;
    right: 20%;
  }

  .hero__gradient-orb--3 {
    background: var(--color-accent-3);
    bottom: 10%;
    left: 50%;
  }

  .hero__noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px;
    z-index: 1;
    pointer-events: none;
  }

  .hero__content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: var(--container-max);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .hero__tag {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    opacity: 0;
  }

  .hero__headline {
    font-size: clamp(44px, 8vw, 108px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
  }

  .hero__word {
    display: inline-block;
    opacity: 0;
    margin-right: 0.2em;
  }

  .hero__word--gradient {
    background: linear-gradient(135deg, var(--color-accent-1) 0%, var(--color-accent-2) 50%, var(--color-accent-3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero__sub {
    font-size: clamp(16px, 1.6vw, 20px);
    line-height: 1.7;
    color: var(--color-text-secondary);
    max-width: 560px;
    font-weight: 300;
    opacity: 0;
  }

  .hero__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-family);
    color: var(--color-text);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    opacity: 0;
  }

  .hero__cta:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-2px);
  }

  .hero__cta svg {
    transition: transform 0.3s ease;
  }

  .hero__cta:hover svg {
    transform: translateX(4px);
  }

  .hero__scroll {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
  }

  .hero__scroll-text {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    font-weight: 400;
  }

  .hero__scroll-line {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, var(--color-text-secondary), transparent);
    position: relative;
    overflow: hidden;
  }

  .hero__scroll-line::after {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, transparent, var(--color-text), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0% { top: -100%; }
    100% { top: 100%; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .hero__gradient-orb {
      width: 300px;
      height: 300px;
    }
    .hero__content {
      gap: 32px;
    }
  }

  @media (max-width: 375px) {
    .hero {
      padding: 40px 16px;
    }
    .hero__cta {
      padding: 14px 28px;
      font-size: 15px;
    }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero__gradient-bg">
    <div class="hero__gradient-orb hero__gradient-orb--1"></div>
    <div class="hero__gradient-orb hero__gradient-orb--2"></div>
    <div class="hero__gradient-orb hero__gradient-orb--3"></div>
  </div>
  <div class="hero__noise"></div>

  <div class="hero__content">
    <p class="hero__tag">Design. Develop. Deploy.</p>

    <h1 class="hero__headline">
      <span class="hero__word">We</span>
      <span class="hero__word">craft</span>
      <span class="hero__word hero__word--gradient">digital</span>
      <span class="hero__word hero__word--gradient">experiences</span>
      <span class="hero__word">that</span>
      <span class="hero__word">matter</span>
    </h1>

    <p class="hero__sub">
      A creative studio focused on building interfaces that are beautiful, functional, and built to last.
    </p>

    <a href="#" class="hero__cta">
      Explore work
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M4 9h10m0 0l-4-4m4 4l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <div class="hero__scroll">
    <span class="hero__scroll-text">Scroll</span>
    <div class="hero__scroll-line"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
    const words = document.querySelectorAll('.hero__word');

    tl.from('.hero__tag', { opacity: 0, y: 20, duration: 0.6 })
      .to(words, {
        opacity: 1,
        y: 0,
        duration: 0.7,
        stagger: 0.08,
      }, '-=0.2')
      .from(words, {
        y: 40,
        duration: 0.7,
        stagger: 0.08,
      }, '<')
      .to('.hero__sub', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
      .from('.hero__sub', { y: 20, duration: 0.6 }, '<')
      .to('.hero__cta', { opacity: 1, y: 0, duration: 0.5 }, '-=0.3')
      .from('.hero__cta', { y: 15, duration: 0.5 }, '<')
      .to('.hero__scroll', { opacity: 1, duration: 0.8 }, '-=0.2');

    // Mouse-following gradient orbs
    const orbs = document.querySelectorAll('.hero__gradient-orb');
    const hero = document.querySelector('.hero');

    hero.addEventListener('mousemove', (e) => {
      const rect = hero.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      gsap.to(orbs[0], { x: x * 80, y: y * 60, duration: 1.2, ease: 'power2.out' });
      gsap.to(orbs[1], { x: x * -60, y: y * -40, duration: 1.4, ease: 'power2.out' });
      gsap.to(orbs[2], { x: x * 50, y: y * 50, duration: 1.6, ease: 'power2.out' });
    });
  });
</script>
</body>
</html>
