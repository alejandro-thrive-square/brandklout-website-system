<!-- The two typefaces are SELF-HOSTED, in assets/fonts/, declared by
     css/03-fonts.css and therefore already inside assets/site.css. There is no
     request to fonts.googleapis.com any more: this is a medical practice, and a
     third-party stylesheet on every page view hands Google the IP of everyone
     who visits. Regenerate with `node site-src/get-fonts.mjs --force`.

     The two most-used cuts are preloaded, because a webfont declared inside a
     stylesheet is not discovered until that stylesheet has parsed, and these
     two set the headline and the body copy. -->
<link rel="preload" href="assets/fonts/cormorant-garamond-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<!-- Every scroll-reveal rule in the stylesheet is scoped to .js, and this is
     what sets it. Inline and in the head so it lands before first paint — there
     is no flash of content that then hides itself.

     The timer is the safety net. Reveals start at opacity 0, so if site.js
     never boots — blocked bundle, an Instatic script conflict, a bad cache —
     content that should be visible would stay invisible. If nothing has
     signalled ready inside 2.5s the class comes off and the whole page paints,
     unanimated. A site with no animation is fine; a site with no content is
     not. -->
<script>
  document.documentElement.classList.add('js');
  setTimeout(function () {
    if (!window.__ssaBooted) document.documentElement.classList.remove('js');
  }, 2500);
</script>
