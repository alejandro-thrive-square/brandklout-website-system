<!-- Code for Open Lightbox Vimeo Video -->
<script>
(function () {
  function fixVimeo() {
    var frame = document.querySelector('.w-lightbox-backdrop iframe');
    if (!frame) return false;
    var src = frame.getAttribute('src') || '';
    if (src.indexOf('player.vimeo.com') > -1 && src.indexOf('autoplay=1') > -1) return true;
    var m = src.match(/player\.vimeo\.com(?:%2F|\/)video(?:%2F|\/)(\d+)/) ||
            src.match(/vimeo\.com(?:%2F|\/)(\d+)/);
    if (m) {
      frame.setAttribute('src', 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1');
      return true;
    }
    return false;
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.w-lightbox')) return;
    var tries = 0;
    var iv = setInterval(function () {
      if (fixVimeo() || ++tries > 60) clearInterval(iv);
    }, 50);
  });
})();
</script>

<!-- Brandklout: Termly -> GoHighLevel consent bridge (v2.0.0)
     Site-wide FOOTER code. Copies each visitor's Termly choice into the hidden privacy_* fields of every
     embedded GHL form, survey or calendar. Needs Termly loaded with autoBlock=off (see README).
     Per site, only CONFIG changes. Docs: deliver/brandklout/snippets/termly-ghl-consent/README.md -->
<script>
(function () {
  var CONFIG = {
    // Written to marketing_disclosure_version. Bump it when the SMS/email consent wording on the form changes.
    marketingDisclosureVersion: "2026-09-16",
    // Written to privacy_policy_version. Leave it empty to use the document version ID Termly reports.
    privacyPolicyVersion: ""
  };

  var FORM_PATH = /\/widget\/(form|survey|booking)\//;
  var FIELDS = [
    "privacy_analytics_consent", "privacy_advertising_consent", "privacy_ad_user_data_consent",
    "privacy_ad_personalization_consent", "privacy_sale_share_opt_out", "privacy_gpc_detected",
    "privacy_consent_timestamp_utc", "privacy_policy_version", "privacy_cmp_receipt_id",
    "privacy_source_url", "marketing_disclosure_version"
  ];

  // Termly's saved record for this visitor, or null before they choose.
  function termlyRecord() {
    try {
      var cache = JSON.parse(localStorage.getItem("TERMLY_API_CACHE") || "{}");
      var entry = cache.TERMLY_COOKIE_CONSENT;
      return entry && entry.value ? { value: entry.value, createdAt: entry.createdAt } : null;
    } catch (e) { return null; }
  }

  function termlyState() {
    try { return window.Termly && Termly.getConsentState ? Termly.getConsentState() : null; } catch (e) { return null; }
  }

  // Until the visitor answers the banner, the form records the same values a Decline click would.
  function values() {
    var record = termlyRecord();
    var saved = record ? record.value : {};
    var state = record ? (termlyState() || saved) : {};
    var gpc = navigator.globalPrivacyControl === true || saved.gpc === true;
    var optOut = gpc || state.do_not_sell === true || state.advertising !== true;
    var ads = state.advertising === true && !optOut ? "granted" : "denied";

    return {
      privacy_analytics_consent: state.analytics === true ? "granted" : "denied",
      privacy_advertising_consent: ads,
      privacy_ad_user_data_consent: ads,
      privacy_ad_personalization_consent: ads,
      privacy_sale_share_opt_out: optOut ? "true" : "false",
      privacy_gpc_detected: gpc ? "true" : "false",
      privacy_consent_timestamp_utc: record && record.createdAt ? new Date(record.createdAt).toISOString() : "",
      privacy_policy_version: CONFIG.privacyPolicyVersion || String(saved.document_version_id || ""),
      privacy_cmp_receipt_id: saved.visitor_id || (saved.visitor && saved.visitor.uuid) || "",
      privacy_source_url: location.origin + location.pathname,
      marketing_disclosure_version: CONFIG.marketingDisclosureVersion
    };
  }

  function withConsent(src) {
    var url = new URL(src, location.href);
    var v = values();
    FIELDS.forEach(function (name) {
      if (v[name]) url.searchParams.set(name, v[name]); else url.searchParams.delete(name);
    });
    return url.toString();
  }

  // Adds the values to each GHL iframe's URL; GHL prefills fields from matching query keys.
  function update() {
    document.querySelectorAll("iframe").forEach(function (frame) {
      var src = frame.getAttribute("src") || "";
      if (!FORM_PATH.test(src)) return;
      var next = withConsent(src);
      if (src !== next) frame.setAttribute("src", next);
    });
  }

  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    setTimeout(function () { queued = false; update(); }, 50);
  }

  update();
  new MutationObserver(schedule).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  // Termly loads async; re-run when it is ready and each time the visitor changes their choice.
  (function hook(tries) {
    if (window.Termly && Termly.on) {
      Termly.on("initialized", schedule);
      Termly.on("consent", schedule);
      schedule();
    } else if (tries < 100) {
      setTimeout(function () { hook(tries + 1); }, 100);
    }
  })(0);
})();
</script>
