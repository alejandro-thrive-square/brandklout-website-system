<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Title, description, Open Graph and JSON-LD are injected here by
     build-site.mjs from site-src/seo.json, so the head partial never needs
     editing per page and 07 has one file to mirror into Webflow page settings. -->
{{HEAD_SEO}}
<link rel="icon" href="assets/logo-green.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cardo and Montserrat are what the practice's live site already loads. -->
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ==========================================================================
     THE STYLESHEET. One file for all three pages, assembled by build-site.mjs
     from site-src/css/*.css in filename order, which IS the cascade order:

       00  fluid root font-size   generated by scripts/fluid-root.mjs
       01  tokens                 the practice's own palette and the type steps
       02  base                   reset and shared primitives
       10-13  chrome              nav, drawer, footer, call bar
       20  kit                    the vocabulary shared by all three pages
       30-38  landing chapters
       40-43  consultation chapters
       50-55  thank-you chapters

     Every page loads the same file, so moving a section between pages means
     moving the markup and nothing else.
     ========================================================================== -->
<link rel="stylesheet" href="assets/site.css">

<!-- ==========================================================================
     TRACKING SEAM. Deliberately empty.

     GTM container GTM-TTLFRPH2 and Meta Pixel 1284882733596471 are already
     installed site-wide on legacydentalpasadena.com, so these pages inherit
     both the moment they exist in Webflow. `Connect tracking` (Asana
     1217658322593903) and `DNI Set Up` (1217658322593910) are Gauge Hill's
     tasks: the conversion trigger belongs in the existing container, and the
     DNI script rewrites the elements marked `data-dni` below.

     Nothing is inserted here by us. Adding a second container would double-fire
     every event the practice already records.
     ========================================================================== -->

<!-- GSAP 3.15, vendored so the package runs offline and headless verification
     is deterministic. In Webflow these load from the GSAP CDN via Page
     Settings instead. The runtime itself is NOT here: it ships at the end of
     <body>, because ScrollTrigger has to be registered after document.body
     exists or ScrollSmoother dies on getScrollFunc. -->
<script src="assets/gsap/gsap.min.js"></script>
<script src="assets/gsap/ScrollTrigger.min.js"></script>
<script src="assets/gsap/ScrollToPlugin.min.js"></script>
<script src="assets/gsap/ScrollSmoother.min.js"></script>
<script src="assets/gsap/SplitText.min.js"></script>
<script src="assets/gsap/Observer.min.js"></script>
</head>
