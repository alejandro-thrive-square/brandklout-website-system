<!-- Sticky mobile call bar. The standard is explicit that the offer, the phone
     and the form stay reachable at every scroll depth, and paid dental traffic
     is mostly mobile. Hidden until the hero has left, so it never covers the
     hero's own CTA. -->
<div class="callbar" id="callbar" aria-hidden="false">
  <a class="btn btn--ghost" href="tel:+16265841800" data-dni="phone"><span>Call</span></a>
  <a class="btn btn--amber" href="{{CTA_HREF}}"><span>{{CTA_LABEL}}</span></a>
</div>
