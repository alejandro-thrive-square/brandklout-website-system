<!-- ==========================================================================
     ADS LANDING HEADER — the site header with the navigation removed.

     It deliberately keeps `id="nav"`, `class="nav"` and the `.nav-progress`
     row, because js/90-boot.js reads `#nav` and `#navProgress` without
     guarding: a landing page with its own header element and no `#nav` throws
     on the first scroll past 40px and takes the rest of the boot sequence with
     it. `#burger` and `#drawer` are absent on purpose, and boot handles that
     case already by returning early.

     There is no logo LINK and no site map. On a paid landing page the logo is
     the practice identifying itself, not a way back to a home page the visitor
     never came from and should not be sent to.

     {{LP_BOOK_HREF}} and {{LP_BOOK_LABEL}} are filled per page by
     build-site.mjs from the `landing` entry in its PAGES table.

     THE TELEPHONE NUMBER is the campaign office's new-patient line, filled
     per page from the LOCATIONS table in build-site.mjs ({{LOC_TEL}} /
     {{LOC_PHONE}}). Call tracking is the LeadConnector number pool loaded by
     partials/site-scripts.html, which swaps the number in the page per
     visitor; nothing here changes for it.
     ========================================================================== -->
<header class="nav lp-nav" id="nav" data-journey="0">
  <div class="nav-progress" aria-hidden="true"><i id="navProgress"></i></div>

  <div class="lp-bar">
    <div class="wrap no-rail lp-bar-in">
      <span class="lp-bar-item">
        <i class="lp-bar-stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</i>
        <b>4.9</b> Google rating</span>
      <span class="lp-bar-item is-wide">Board-certified prosthodontist &middot;
        <b>18,000+</b> implants placed</span>
      <span class="lp-bar-item is-wide">{{LOC_BAR}}</span>
    </div>
  </div>

  <div class="wrap no-rail lp-nav-in">
    <span class="nav-logo">
      <img src="assets/logo.png" alt="Dr. Nahlah, Implants and Prosthodontics Specialists">
    </span>
    <div class="lp-nav-side">
      <a class="lp-nav-phone" href="tel:{{LOC_TEL}}">
        <i aria-hidden="true">&#9742;</i><span>{{LOC_PHONE}}</span></a>
      <a class="lp-nav-cta" href="{{LP_BOOK_HREF}}">{{LP_BOOK_LABEL}}</a>
    </div>
  </div>
</header>
