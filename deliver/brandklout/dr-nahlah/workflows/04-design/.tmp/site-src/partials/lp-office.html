<!-- One office panel. Rendered twice per page by build-site.mjs, the
     campaign's own office first, from the LOCATIONS table. -->
<article class="ct-office">
  <h3>{{O_NAME}}</h3>
  <address>Dr. Nahlah Implants and Prosthodontics Specialists<br>
    {{O_ADDR1}}<br>
    {{O_ADDR2}}</address>
  <div class="ct-office-line"><span>New patients</span>
    <a href="tel:{{O_TEL}}">{{O_PHONE}}</a></div>
  <div class="ct-office-line"><span>Current patients</span>
    <a href="tel:{{O_CUR_TEL}}">{{O_CUR_PHONE}}</a></div>
  <p class="ct-office-flag">{{O_FLAG}}</p>
  <a class="pk-more ct-office-dirs"
     href="{{O_MAPS}}"
     target="_blank" rel="noopener">Directions</a>
</article>
