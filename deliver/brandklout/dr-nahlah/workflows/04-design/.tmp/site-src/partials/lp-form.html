<!-- ==========================================================================
     THE CAMPAIGN FORM. One LeadConnector form per campaign per office, filled
     in by build-site.mjs from the LOCATIONS table: {{LOC_FORM_ID}},
     {{LOC_FORM_NAME}} and {{LOC_FORM_H}} are that office's form for this
     page's campaign. The six ids came from Brandklout on 2026-09-17
     (workflows/00-client-delivery-initialization/.tmp/iframes.html).

     THE EMBED WRAPPER IS LOAD-BEARING. `<div class="wz-embed"
     data-wz-embed="auto">` around the vendor markup verbatim is what the
     Instatic CSP filter's `compatible` mode engages on; without it the vendor
     iframe and script are refused and the form renders as nothing. Do not
     rename it and do not tidy the vendor snippet inside it.

     The redirect to this campaign's thank-you page is a LeadConnector setting
     on the form, not markup here: `/ads-{{LOC_KEY}}-{{CAMPAIGN}}-thank-you`.
     ========================================================================== -->
<div class="wz-embed" data-wz-embed="auto"><iframe
    src="https://api.leadconnectorhq.com/widget/form/{{LOC_FORM_ID}}"
    style="width:100%;height:100%;border:none;border-radius:8px"
    id="inline-{{LOC_FORM_ID}}"
    data-layout="{'id':'INLINE'}"
    data-trigger-type="alwaysShow"
    data-trigger-value=""
    data-activation-type="alwaysActivated"
    data-activation-value=""
    data-deactivation-type="neverDeactivate"
    data-deactivation-value=""
    data-form-name="{{LOC_FORM_NAME}}"
    data-height="{{LOC_FORM_H}}"
    data-layout-iframe-id="inline-{{LOC_FORM_ID}}"
    data-form-id="{{LOC_FORM_ID}}"
    data-cookie-consent="true"
    data-cookie-consent-provider="auto"
    title="{{LOC_FORM_NAME}}"
>
</iframe>
<script src="https://link.msgsndr.com/js/form_embed.js"></script></div>
