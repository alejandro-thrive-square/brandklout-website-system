{{SITE_SCRIPTS}}

<!-- ==========================================================================
     THE STYLESHEET. One file for the whole site, assembled by build-site.mjs
     from site-src/css/*.css in filename order, which IS the cascade order:

       00  fluid root font-size  generated; deliver/process/04-design/fluid-root.md
       01  design tokens         palette, theme layer, type steps
       02  base                  reset and the shared primitives
       10-12  chrome             nav, drawer, footer
       20  page kit              the shared interior-page section vocabulary
       30-38  home chapters      the nine bespoke chapters of the journey
       50-59  page overrides     rules only one page needs

     Every page loads the same file, so moving a section from one page to another
     means moving the markup and nothing else. It also means the rules exist once
     rather than being re-emitted into all 26 pages.
     ========================================================================== -->
<link rel="stylesheet" href="assets/site.css">

<!-- GSAP 3.15 — vendored locally so the package runs offline and headless
     verification is deterministic. Webflow build should load the same files
     from the GSAP CDN via Page Settings instead.
     The runtime itself is NOT here: it lives in assets/site.js at the end of
     <body>, because ScrollTrigger has to be registered after document.body
     exists or ScrollSmoother dies on getScrollFunc. -->
<script src="assets/gsap/gsap.min.js"></script>
<script src="assets/gsap/ScrollTrigger.min.js"></script>
<script src="assets/gsap/ScrollToPlugin.min.js"></script>
<script src="assets/gsap/ScrollSmoother.min.js"></script>
<script src="assets/gsap/SplitText.min.js"></script>
<script src="assets/gsap/Observer.min.js"></script>
</head>
