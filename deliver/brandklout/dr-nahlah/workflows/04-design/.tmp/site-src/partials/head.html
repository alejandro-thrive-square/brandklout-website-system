<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Nahlah — Implant &amp; Prosthodontic Specialists | McLean &amp; Alexandria, VA</title>
<meta name="description" content="Board-certified prosthodontist Dr. Esam Nahlah rebuilds smiles with dental implants, All-on-4 and full-mouth reconstruction in McLean and Alexandria, Virginia.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- ==========================================================================
     GLOBAL LAYER ONLY — tokens, reset, shared primitives.
     Every section below carries its own <style> and <script>, so a section can
     be lifted into Webflow as one self-contained embed.
     ========================================================================== -->
<style>
:root{
  --gold:#AB9E6A; --gold-light:#D4CDB2; --gold-deep:#8A7E4E; --gold-wash:#F5F2E9;
  /* --gold-deep is only 3.7:1 on the cream ground — fine for display sizes,
     short of AA for the small uppercase labels. --gold-ink is the same hue
     taken dark enough to clear 4.5:1 on --warm and on white. */
  --gold-ink:#665C33;
  --black:#0B0B0C; --ink-900:#141416; --ink-800:#1C1C1F; --ink-700:#2A2A2E; --ink-500:#6B6B72;
  --white:#fff; --warm:#FAF8F3; --mist:#F0EDE6;

  /* ------------------------------------------------------------------
     THEME LAYER.
     The site is light: warm cream is the ground, ink is the text, and the
     two dark chapters (the film and the invitation) plus the footer and the
     drawer opt in with data-theme="dark". Every section below paints from
     these six names only — never a raw hex or a raw rgba(255,255,255,x) —
     so a section can be flipped by changing the scope it sits in, not by
     rewriting its rules.
       --bg      the ground                --fg       headings, strong text
       --bg-2    the alternate band        --fg-body  body copy
       --bg-3    the accent band           --fg-soft  meta, captions, labels
       --card    raised panel              --line     hairlines and borders
     Gold splits three ways because brand gold is only 2.4:1 on cream:
       --accent      text-sized gold (labels, links)  — clears AA
       --accent-lg   display-sized gold (numerals, quote marks)
       --rule        gold hairlines and dots (non-text)
     ------------------------------------------------------------------ */
  --bg:#FAF8F3; --bg-2:#FFFFFF; --bg-3:#F5F2E9; --card:#FFFFFF;
  --fg:#141416; --fg-body:#3A3A40; --fg-soft:#55555C; --fg-faint:#6E6E76;
  --line:rgba(20,20,22,.13); --line-2:rgba(20,20,22,.07); --line-strong:rgba(20,20,22,.3);
  --accent:var(--gold-ink); --accent-lg:var(--gold-deep); --rule:var(--gold-deep);
  --focus:var(--gold-deep);
  /* Scrim over photography, so text on an image reads on either theme. */
  --scrim:rgba(11,11,12,.62);
  --f-display:'Playfair Display','Times New Roman',serif;
  --f-body:'Raleway','Helvetica Neue',Arial,sans-serif;
  --d1:clamp(2.75rem,7.4vw,8.25rem);
  --d2:clamp(2.25rem,5.2vw,5.5rem);
  --h2:clamp(1.9rem,3.6vw,3.75rem);
  --h3:clamp(1.35rem,1.9vw,2rem);
  --body-lg:clamp(1.05rem,1.25vw,1.25rem);
  --body:clamp(.975rem,1.05vw,1.0625rem);
  --label:clamp(.68rem,.78vw,.78rem);
  --gutter:clamp(1.25rem,4vw,4.5rem);
  --section:clamp(4.5rem,9vw,9.5rem);
  --maxw:1560px;
  /* Was a gutter for the left chapter rail; the rail was removed in favour of a
     progress bar on the nav, so content is full-width again. Kept as a token so
     section rules that reference it stay valid. */
  --rail:0px;
}
/* The dark chapters. Scoped, not global, so nesting works: a light card inside
   a dark band only has to carry data-theme="light" to come back. */
[data-theme="dark"]{
  --bg:#0B0B0C; --bg-2:#141416; --bg-3:#1C1C1F; --card:#141416;
  --fg:#FFFFFF; --fg-body:rgba(255,255,255,.78); --fg-soft:rgba(255,255,255,.62);
  --fg-faint:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.3);
  --accent:var(--gold); --accent-lg:var(--gold); --rule:var(--gold);
  --focus:var(--gold-light);
  background:var(--bg);color:var(--fg-body);
}
[data-theme="light"]{
  --bg:#FAF8F3; --bg-2:#FFFFFF; --bg-3:#F5F2E9; --card:#FFFFFF;
  --fg:#141416; --fg-body:#3A3A40; --fg-soft:#55555C; --fg-faint:#6E6E76;
  --line:rgba(20,20,22,.13); --line-2:rgba(20,20,22,.07); --line-strong:rgba(20,20,22,.3);
  --accent:var(--gold-ink); --accent-lg:var(--gold-deep); --rule:var(--gold-deep);
  --focus:var(--gold-deep);
  background:var(--bg);color:var(--fg-body);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg-body);
  font-family:var(--f-body);font-size:var(--body);line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.is-locked{overflow:hidden}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:500;line-height:1.02;
  letter-spacing:-.02em;color:var(--fg)}
p{margin:0}
::selection{background:var(--gold);color:var(--black)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* Content clears the fixed rail rather than sliding under it. */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;
  padding-right:var(--gutter);padding-left:calc(var(--gutter) + var(--rail))}
.wrap.no-rail{padding-left:var(--gutter)}
.section{padding-block:var(--section)}
.label{font-size:var(--label);letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  color:var(--accent);font-family:var(--f-body)}
.chapter-tag{display:flex;align-items:center;gap:.85rem;margin-bottom:1.4rem}
.chapter-tag i{width:clamp(24px,3.5vw,48px);height:1px;background:var(--rule);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1.05rem 2rem;
  font-size:var(--label);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  position:relative;overflow:hidden;transition:color .45s cubic-bezier(.22,1,.36,1);will-change:transform}
.btn>span{position:relative;z-index:1}
/* The hover fill is the theme's ink, and the label flips to the theme's ground,
   so one rule reads correctly on cream and on black. */
.btn::after{content:"";position:absolute;inset:0;background:var(--fg);transform:translateY(101%);
  transition:transform .55s cubic-bezier(.22,1,.36,1);z-index:0}
.btn:hover::after{transform:translateY(0)}
.btn:hover{color:var(--bg)}
.btn-primary{background:linear-gradient(100deg,var(--gold-deep),var(--gold) 45%,var(--gold-light));color:var(--black)}
.btn-ghost{border:1px solid var(--line-strong);color:var(--fg)}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-dark::after{background:var(--ink-700)}
.btn-dark:hover{color:var(--bg)}

/* ScrollSmoother scaffolding — fixed UI lives OUTSIDE the wrapper */
#smooth-wrapper{overflow:hidden}

/* Pre-paint guard: hide split targets until GSAP has set their state so we
   never flash unsplit text. .wz-ready is set by the bootstrap. */
[data-anim="hide"]{visibility:hidden}
.wz-ready [data-anim="hide"]{visibility:visible}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  [data-anim="hide"]{visibility:visible!important}
}
</style>

<!-- GSAP 3.15 — vendored locally so the package runs offline and headless
     verification is deterministic. Webflow build should load the same files
     from the GSAP CDN via Page Settings instead. -->
<script src="assets/gsap/gsap.min.js"></script>
<script src="assets/gsap/ScrollTrigger.min.js"></script>
<script src="assets/gsap/ScrollToPlugin.min.js"></script>
<script src="assets/gsap/ScrollSmoother.min.js"></script>
<script src="assets/gsap/SplitText.min.js"></script>
<script src="assets/gsap/Observer.min.js"></script>

<script>
/* ==========================================================================
   BOOTSTRAP (the only shared script)
   Section scripts push their setup into WZ.add(). We create ScrollSmoother
   first, then flush the queue, so every ScrollTrigger measures against the
   final smoothed layout. Without this ordering, triggers registered mid-parse
   measure a half-built page.
   ========================================================================== */
window.WZ = (function(){
  var q = [], flushed = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ok = !!(window.gsap && window.ScrollTrigger);

  /* NOTE: plugins are deliberately NOT registered here. This script runs inside
     <head>, where document.body does not exist yet — registering ScrollTrigger
     that early leaves its internals half-initialised, and ScrollSmoother then
     dies on `getScrollFunc` with "Cannot read properties of undefined". The
     flush block at the end of <body> does the registration instead. */

  /* Split into masked lines, with graceful degradation if SplitText is absent. */
  /* Pass `build` when the lines carry a tween: it runs on the first split and
     again on every re-split, and whatever it returns is killed before the next
     one so tweens never point at dead nodes. Omit it for one-shot entrances —
     the lines still re-flow, they just do not re-animate. */
  function splitLines(el, build){
    if(!window.SplitText) return null;
    try{
      var opts = {type:'lines', mask:'lines', linesClass:'wz-line', autoSplit:true};
      if(build) opts.onSplit = function(self){ return build(self); };
      return (SplitText.create ? SplitText.create(el,opts) : new SplitText(el,opts));
    }catch(e){
      try{ return new SplitText(el,{type:'lines',linesClass:'wz-line'}); }catch(e2){ return null; }
    }
  }
  function splitWords(el){
    if(!window.SplitText) return null;
    try{
      var opts = {type:'words', wordsClass:'wz-word'};
      return (SplitText.create ? SplitText.create(el,opts) : new SplitText(el,opts));
    }catch(e){ return null; }
  }

  return {
    reduced: reduced,
    ok: ok,
    smoother: null,
    splitLines: splitLines,
    splitWords: splitWords,
    add: function(fn){ flushed ? this.run(fn) : q.push(fn); },
    run: function(fn){ try{ fn(this); }catch(e){ console.error('[WZ section]', e); } },
    flush: function(){
      flushed = true;
      var self = this;
      q.forEach(function(fn){ self.run(fn); });
      q.length = 0;
    }
  };
})();
</script>
</head>
