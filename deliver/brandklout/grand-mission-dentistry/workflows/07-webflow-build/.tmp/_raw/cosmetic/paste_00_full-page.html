l, true, 'center center');\n      else panel.scrollIntoView({ block: 'center' });\n    };\n\n    if (!LEAD_ENDPOINT) {\n      console.info('[lead] would POST to GHL:', data);\n      finish();\n      return;\n    }\n\n    submit.disabled = true;\n    submit.querySelector('span').textContent = 'Sending\u2026';\n    fetch(LEAD_ENDPOINT, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify(data),\n    })\n      .then(function () {\n        if (THANK_YOU_URL) { window.location.href = THANK_YOU_URL; return; }\n        finish();\n      })\n      .catch(function () {\n        submit.disabled = false;\n        submit.querySelector('span').textContent = 'Request my consultation';\n        var slot = form.querySelector('[data-error-for=\"f-consent\"]');\n        if (slot) slot.textContent = 'Something went wrong. Please call the practice instead.';\n      });\n  });\n\n  function validate() {\n    form.querySelectorAll('[aria-invalid]').forEach(function (el) {\n      el.removeAttribute('aria-invalid');\n    });\n    form.querySelectorAll('.field__error').forEach(function (el) { el.textContent = ''; });\n\n    var ok = true;\n    form.querySelectorAll('input[required]').forEach(function (input) {\n      var valid =\n        input.type === 'checkbox'\n          ? input.checked\n          : input.value.trim() !== '' && input.checkValidity();\n      if (!valid) {\n        ok = false;\n        input.setAttribute('aria-invalid', 'true');\n        var slot = form.querySelector('[data-error-for=\"' + input.id + '\"]');\n        if (slot) {\n          slot.textContent =\n            input.type === 'checkbox'\n              ? 'Please agree to the terms so we can contact you.'\n              : input.value.trim() === ''\n              ? 'This one is required.'\n              : 'Please check this is correct.';\n        }\n      }\n    });\n    return ok;\n  }\n});\n<\/script>","data":{"search":{"exclude":false},"embed":{"meta":{"html"      el.textContent = counters[key].toLocaleString('en-US');\n    });\n  });\n\n  document.querySelectorAll('[data-tel]').forEach(function (el) {\n    el.textContent = OFFER.phoneDisplay;\n  });\n  document.querySelectorAll('[data-tel-link]').forEach(function (el) {\n    el.setAttribute('href', 'tel:' + OFFER.phoneDial);\n  });\n\n  /* ---------- lead form -------------------------------------------------- */\n  var panel = document.getElementById('book');\n  var form = document.getElementById('leadForm');\n  var submit = document.getElementById('formSubmit');\n  if (!panel || !form) return;\n\n  form.addEventListener('submit', function (event) {\n    event.preventDefault();\n    if (!validate()) return;\n\n    /* Honeypot: a bot fills every field it finds, a patient never sees it. */\n    if (form.company_website && form.company_website.value) return;\n\n    var data = {};\n    new FormData(form).forEach(function (value, key) { data[key] = value; });\n    data.page = 'cosmetic-landing-page';\n    data.asana_task_gid = '1217072657902270';\n\n    var finish = function () {\n      panel.classList.add('is-done');\n      if (window.ScrollTrigger) ScrollTrigger.refresh();\n      if (window.WZ && WZ.smoother) WZ.smoother.scrollTo(panel, true, 'center center');\n      else panel.scrollIntoView({ block: 'center' });\n    };\n\n    if (!LEAD_ENDPOINT) {\n      console.info('[lead] would POST to GHL:', data);\n      finish();\n      return;\n    }\n\n    submit.disabled = true;\n    submit.querySelector('span').textContent = 'Sending\u2026';\n    fetch(LEAD_ENDPOINT, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify(data),\n    })\n      .then(function () {\n        if (THANK_YOU_URL) { window.location.href = THANK_YOU_URL; return; }\n        finish();\n      })\n      .catch(function () {\n        submit.disabled = false;\n        submit.querySelector('span').textContent = 'Request my consultation';\n        var slot = form.querySelector('[data-error-for=\"f-consent\"]');\n        if (slot) slot.textContent = 'Something went wrong. Please call the practice instead.';\n      });\n  });\n\n  function validate() {\n    form.querySelectorAll('[aria-invalid]').forEach(function (el) {\n      el.removeAttribute('aria-invalid');\n    });\n    form.querySelectorAll('.field__error').forEach(function (el) { el.textContent = ''; });\n\n    var ok = true;\n    form.querySelectorAll('input[required]').forEach(function (input) {\n      var valid =\n        input.type === 'checkbox'\n          ? input.checked\n          : input.value.trim() !== '' && input.checkValidity();\n      if (!valid) {\n        ok = false;\n        input.setAttribute('aria-invalid', 'true');\n        var slot = form.querySelector('[data-error-for=\"' + input.id + '\"]');\n        if (slot) {\n          slot.textContent =\n            input.type === 'checkbox'\n              ? 'Please agree to the terms so we can contact you.'\n              : input.value.trim() === ''\n              ? 'This one is required.'\n              : 'Please check this is correct.';\n        }\n      }\n    });\n    return ok;\n  }\n});\n<\/script>","div":false,"script":true,"compilable":false,"iframe":false},"type":"html"},"insideRTE":false,"content":"","devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[],"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}}}},{"_id":"8b643617-b49c-4891-83cb-f7fe8ace3b76","type":"Block","tag":"section","classes":["15c4db14-0095-45af-88b1-8c4759b0ade1","13fb16a9-edea-4147-93dc-e92c214267d3","d98d61fc-7fbc-4113-81c2-9bf975e7bf04"],"children":["4cd0a17f-2cf9-46ac-bf69-12547bc6ae3a","7d07706e-ed1a-47e6-9dad-7690312efd0c"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":"hands"},"xattr":[{"name":"data-recede","value":""},{"name":"data-chapter","value":"1"},{"name":"data-chapter-name","value":"The Hands"},{"name":"data-theme","value":"paper <script>
  const json = document.getElementById('payload').textContent;
  document.getElementById('btn').addEventListener('click', () => {
    const handler = (e) => {
      e.preventDefault();
      e.clipboardData.setData('application/json', json);
      e.clipboardData.setData('text/plain', json);
    };
    document.addEventListener('copy', handler);
    const ok = document.execCommand('copy');
    document.removeEventListener('copy', handler);
    const s = document.getElementById('status');

    s.className = ok ? 'ok' : '';
  });
