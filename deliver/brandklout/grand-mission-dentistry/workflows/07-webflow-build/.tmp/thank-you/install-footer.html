<!doctype html><html><head><meta charset="utf-8"><title>Install FOOTER</title>
<style>body{font:14px system-ui;margin:2rem;max-width:760px}button{font-size:1.05rem;padding:.8rem 1.4rem;background:#1463ff;color:#fff;border:0;border-radius:.4rem;cursor:pointer}.ok{color:#0a7d28;font-weight:600;margin-left:1rem}textarea{width:100%;height:280px;font:12px monospace;margin-top:1rem}</style>
</head><body>
<h2>Install FOOTER — Grand Mission shared page layer (14499 chars, Data API install)</h2>
<p><button id="b">Copy</button><span id="s"></span></p>
<textarea id="d" readonly>&lt;!-- GRAND MISSION LP SHARED LAYER (footer) — identical on the three LP
     pages. registerPlugin + ScrollSmoother.create + WZ.flush; a second
     copy anywhere kills every trigger. --&gt;
&lt;script&gt;
(() =&gt; {
/* WZ page runtime — FOOTER. Identical on all three Grand Mission pages; a
   page-level second copy anywhere else is fatal (a duplicate
   ScrollSmoother.create kills every trigger). Order: kit registers last so
   section embeds (queued mid-parse) run first at flush; nothing here depends
   on that order. */

/* ---- KIT: page-generic, selector-driven, idempotent ---------------------- */
WZ.add(function (W) {
  /* reveals: [data-rv] / [data-rv="stagger"] — a nested [data-rv] is covered
     by its parent's stagger; two `from` tweens on one node fight and can
     strand it invisible. */
  gsap.utils.toArray('[data-rv]').forEach(function (el) {
    if (el.parentElement &amp;&amp; el.parentElement.closest('[data-rv]')) return;
    var mode = el.getAttribute('data-rv');
    gsap.set(el, { opacity: 1 });
    gsap.from(mode === 'stagger' ? el.children : el, {
      opacity: 0, y: 34, duration: 0.95, ease: 'power3.out',
      stagger: mode === 'stagger' ? 0.09 : 0,
      scrollTrigger: { trigger: el, start: 'top 86%' },
    });
  });

  /* masked line reveals: [data-split] */
  gsap.utils.toArray('[data-split]').forEach(function (el) {
    gsap.set(el, { opacity: 1 });
    W.splitLines(el, function (self) {
      return gsap.from(self.lines, {
        yPercent: 112, duration: 1.05, stagger: 0.08, ease: 'power4.out',
        scrollTrigger: { trigger: el, start: 'top 88%' },
      });
    });
  });

  /* clip-path wipes: [data-wipe] — the mask animates, not the opacity */
  gsap.utils.toArray('[data-wipe]').forEach(function (el) {
    var dir = el.getAttribute('data-wipe') || 'up';
    var from = dir === 'left' ? 'inset(0% 100% 0% 0%)'
      : dir === 'right' ? 'inset(0% 0% 0% 100%)' : 'inset(100% 0% 0% 0%)';
    gsap.fromTo(el, { clipPath: from }, {
      clipPath: 'inset(0% 0% 0% 0%)', duration: 1.25, ease: 'power4.inOut',
      scrollTrigger: { trigger: el, start: 'top 84%' },
    });
  });

  /* parallax drift: [data-drift] — scale stays above 1 at both ends; a
     scrubbed scale landing exactly on 1 flickers as it re-rasterises */
  gsap.utils.toArray('[data-drift]').forEach(function (img) {
    var amount = parseFloat(img.getAttribute('data-drift')) || 7;
    gsap.fromTo(img, { yPercent: -amount, scale: 1.14 }, {
      yPercent: amount, scale: 1.14, ease: 'none',
      scrollTrigger: { trigger: img.parentElement, start: 'top bottom', end: 'bottom top', scrub: 0.6 },
    });
  });

  /* counters: [data-count] */
  gsap.utils.toArray('[data-count]').forEach(function (el) {
    var target = parseFloat(el.getAttribute('data-count')),
      dec = parseInt(el.getAttribute('data-decimals') || '0', 10),
      prefix = el.getAttribute('data-prefix') || '',
      suffix = el.getAttribute('data-suffix') || '',
      obj = { v: 0 };
    gsap.to(obj, {
      v: target, duration: 1.9, ease: 'power2.out',
      scrollTrigger: { trigger: el.closest('[data-count-scope]') || el, start: 'top 88%' },
      onUpdate: function () {
        el.textContent = prefix + obj.v.toLocaleString('en-US',
          { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix;
      },
    });
  });

  /* magnetic CTAs + cursor-aware sheen — pointer-fine only */
  if (W.fine) {
    document.querySelectorAll('.magnetic').forEach(function (el) {
      var xTo = gsap.quickTo(el, 'x', { duration: 0.5, ease: 'power3' }),
        yTo = gsap.quickTo(el, 'y', { duration: 0.5, ease: 'power3' });
      el.addEventListener('pointermove', function (e) {
        var r = el.getBoundingClientRect();
        xTo((e.clientX - r.left - r.width / 2) * 0.22);
        yTo((e.clientY - r.top - r.height / 2) * 0.4);
      });
      el.addEventListener('pointerleave', function () { xTo(0); yTo(0); });
    });
    document.querySelectorAll('[data-cursor-card]').forEach(function (card) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((e.clientX - r.left) / r.width) * 100 + '%');
        card.style.setProperty('--my', ((e.clientY - r.top) / r.height) * 100 + '%');
      });
    });
  }

  /* marquee: [data-marquee] — track duplicated in markup, -50% loop */
  gsap.utils.toArray('[data-marquee]').forEach(function (track) {
    var tween = gsap.to(track, {
      xPercent: -50, duration: parseFloat(track.getAttribute('data-marquee')) || 34,
      ease: 'none', repeat: -1,
    });
    track.addEventListener('pointerenter', function () { tween.timeScale(0.25); });
    track.addEventListener('pointerleave', function () { tween.timeScale(1); });
  });

  /* chapter departures: [data-recede] — the range starts late on purpose;
     only the tail already leaving the viewport is dimmed */
  gsap.utils.toArray('[data-recede]').forEach(function (sec) {
    gsap.to(sec, {
      opacity: 0.35, yPercent: -3, ease: 'none',
      scrollTrigger: { trigger: sec, start: 'bottom 30%', end: 'bottom top', scrub: 0.5 },
    });
  });

  /* reading progress on the header */
  var bar = document.getElementById('readProgress');
  if (bar) gsap.to(bar, { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 0.25 } });

  /* chapter tags: the rule draws itself out from the number */
  gsap.utils.toArray('.chapter-tag').forEach(function (tag) {
    gsap.fromTo(tag.querySelector('i'), { scaleX: 0 }, {
      scaleX: 1, duration: 0.9, ease: 'power3.out',
      scrollTrigger: { trigger: tag, start: 'top 92%' },
    });
  });

  /* chapter readout: which beat of the journey you are in */
  var chapters = gsap.utils.toArray('section[data-chapter]');
  var num = document.getElementById('chNum'),
    name = document.getElementById('chName'),
    chBar = document.getElementById('chBar'),
    readout = document.getElementById('chapterReadout');
  if (chapters.length &amp;&amp; readout) {
    var last = chapters.length - 1;
    chapters.forEach(function (sec) {
      var i = parseInt(sec.getAttribute('data-chapter'), 10);
      var label = sec.getAttribute('data-chapter-name');
      var activate = function () {
        if (num) num.textContent = String(i).padStart(2, '0');
        if (name) name.textContent = label;
        if (chBar) chBar.style.setProperty('--p', last ? (i / last).toFixed(3) : '1');
      };
      ScrollTrigger.create({ trigger: sec, start: 'top 55%', end: 'bottom 45%', onEnter: activate, onEnterBack: activate });
    });
    ScrollTrigger.create({
      start: 220, end: 'max',
      onToggle: function (self) { readout.classList.toggle('is-on', self.isActive); },
    });
  }
});

/* ---- content behaviours: work with or without GSAP ----------------------- */
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  WZ.onReady(function () {
    /* animated accordion, one open at a time */
    var items = Array.prototype.slice.call(document.querySelectorAll('.faq__item'));
    items.forEach(function (item) {
      var btn = item.querySelector('.faq__q');
      var panel = item.querySelector('.faq__a');
      if (!btn || !panel) return;
      var open = function (state) {
        item.classList.toggle('is-open', state);
        btn.setAttribute('aria-expanded', String(state));
        if (window.gsap &amp;&amp; !reduced) {
          gsap.to(panel, {
            height: state ? 'auto' : 0, duration: 0.5, ease: 'power3.inOut',
            onComplete: function () { if (window.ScrollTrigger) ScrollTrigger.refresh(); },
          });
        } else panel.style.height = state ? 'auto' : '0px';
      };
      panel.style.height = '0px';
      panel.style.overflow = 'hidden';
      btn.addEventListener('click', function () {
        var willOpen = !item.classList.contains('is-open');
        items.forEach(function (other) {
          if (other !== item &amp;&amp; other.classList.contains('is-open')) {
            var op = other.querySelector('.faq__a');
            other.classList.remove('is-open');
            other.querySelector('.faq__q').setAttribute('aria-expanded', 'false');
            if (window.gsap &amp;&amp; !reduced) gsap.to(op, { height: 0, duration: 0.4, ease: 'power3.inOut' });
            else op.style.height = '0px';
          }
        });
        open(willOpen);
      });
    });

    /* lightbox */
    var box = document.getElementById('lightbox');
    if (box) {
      var img = document.getElementById('lightboxImg');
      var close = document.getElementById('lightboxClose');
      var lastTrig = null;
      document.querySelectorAll('[data-lightbox]').forEach(function (trigger) {
        trigger.addEventListener('click', function () {
          lastTrig = trigger;
          img.src = trigger.getAttribute('data-lightbox');
          img.alt = (trigger.querySelector('img') || {}).alt || 'Patient result';
          box.classList.add('is-open');
          if (window.gsap &amp;&amp; !reduced) gsap.fromTo(img, { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' });
          close.focus();
        });
      });
      var hide = function () {
        box.classList.remove('is-open');
        img.src = '';
        if (lastTrig) lastTrig.focus();
      };
      close.addEventListener('click', hide);
      box.addEventListener('click', function (e) { if (e.target === box) hide(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' &amp;&amp; box.classList.contains('is-open')) hide();
      });
    }

    /* header state + sticky mobile bar — window.scrollY stays authoritative
       under ScrollSmoother; listening to ScrollTrigger keeps both honest */
    var header = document.getElementById('header');
    var mbar = document.getElementById('mobileBar');
    var onScroll = function () {
      var y = window.scrollY || document.documentElement.scrollTop;
      if (header) header.classList.toggle('is-stuck', y &gt; 10);
      if (mbar) mbar.classList.toggle('is-visible', y &gt; 380);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    if (window.ScrollTrigger) ScrollTrigger.addEventListener('refresh', onScroll);

    var year = document.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();
  });
})();

/* ---- BOOT: register, smoother, flush ------------------------------------ */
/* Waits for BOTH the DOM and the webfont. The DOM gate guarantees every
   section's behaviour embed (registered mid-parse, DOM-ready-fired) runs
   before the kit reads what it wrote — e.g. the offer counters' data-count.
   The font gate is not cosmetic: SplitText autoSplit re-splits on font swap,
   and if a pinned chapter is already built its heading lives inside a
   pin-spacer at that moment — the next refresh throws mid-unwrap and the
   page ends up thousands of px shorter than ScrollTrigger believes. The race
   is against a timeout: a font that never arrives must not cost the page. */
function wzFlush() {
  var dom = new Promise(function (r) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { r(); });
    else r();
  });
  var fonts = document.fonts &amp;&amp; document.fonts.ready
    ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1800); })])
    : Promise.resolve();
  Promise.all([dom, fonts]).then(wzBoot, wzBoot);
}

function wzStatic() {
  /* No motion — GSAP missing or reduced motion asked for. Paint everything:
     pre-staged "not yet" states must resolve, and figures must read final. */
  document.documentElement.classList.add('wz-static');
  document.querySelectorAll('[data-rv],[data-split],[data-wipe]').forEach(function (el) {
    el.style.opacity = '1';
    el.style.clipPath = 'none';
  });
  document.querySelectorAll('[data-count],[data-scrub-count]').forEach(wzPaintFinal);
}

function wzBoot() {
  var W = window.WZ;
  document.documentElement.classList.add('wz-ready');

  if (!W || !W.ok) {
    wzStatic();
    return;
  }

  /* Register BEFORE the reduced-motion branch: anything probing
     ScrollTrigger (even just maxScroll) needs wired internals, reduced or
     not. Reduced motion still means no smoother, no triggers, no pins. */
  gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);
  if (window.ScrollSmoother) gsap.registerPlugin(ScrollSmoother);
  if (window.SplitText) gsap.registerPlugin(SplitText);

  if (W.reduced) {
    wzStatic();
    return;
  }

  document.body.classList.add('wz-motion');

  if (window.ScrollSmoother) {
    try {
      W.smoother = ScrollSmoother.create({
        wrapper: '#smooth-wrapper', content: '#smooth-content',
        smooth: 1.05, effects: false, smoothTouch: false,
        normalizeScroll: false, ignoreMobileResize: true,
      });
    } catch (e) { console.warn('ScrollSmoother unavailable', e); }
  }

  W.flush();

  /* anchors route through the smoother, or pinned sections land wrong */
  document.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var id = a.getAttribute('href');
      if (!id || id.length &lt; 2) return;
      var t = document.querySelector(id);
      if (!t) return;
      e.preventDefault();
      if (W.smoother) W.smoother.scrollTo(t, true, 'top 80px');
      else gsap.to(window, { duration: 1, scrollTo: { y: t, offsetY: 80 }, ease: 'power2.inOut' });
    });
  });

  /* late images change the height of everything below them */
  window.addEventListener('load', function () {
    requestAnimationFrame(function () {
      try { ScrollTrigger.refresh(); } catch (e) { console.warn('ScrollTrigger refresh skipped', e); }
    });
  });
}

function wzPaintFinal(el) {
  var dec = parseInt(el.getAttribute('data-decimals') || '0', 10);
  var value = el.getAttribute('data-count') || el.getAttribute('data-scrub-count');
  el.textContent = (el.getAttribute('data-prefix') || '') +
    parseFloat(value).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) +
    (el.getAttribute('data-suffix') || '');
}

wzFlush();
})();
&lt;/script&gt;</textarea>
<script>
const t=document.getElementById('d').value;
document.getElementById('b').addEventListener('click',()=>{
  const h=ev=>{ev.preventDefault();ev.clipboardData.setData('text/plain',t);};
  document.addEventListener('copy',h);
  const ok=document.execCommand('copy');
  document.removeEventListener('copy',h);
  const s=document.getElementById('s');
  s.textContent= ok ? '✓ Copied '+t.length+' chars' : 'Copy failed';
  s.className= ok ? 'ok':'';
});
</script></body></html>
