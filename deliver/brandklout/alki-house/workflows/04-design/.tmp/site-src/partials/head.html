<!-- Display: Bricolage Grotesque. Body/UI: Manrope. Specs and labels: JetBrains Mono.

<!-- One stylesheet for the whole site, assembled by build-site.mjs from
     site-src/css/*.css in filename order (00 root, 01 tokens, 02 base,
     10-12 chrome, 20 kit, 30-37 home chapters, 40-42 catalogue, 50-53 product). -->
<link rel="stylesheet" href="{{ROOT}}assets/site.css">
