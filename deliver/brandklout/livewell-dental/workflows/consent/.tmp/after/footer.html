<!-- Code for Open Lightbox Vimeo Video -->
<script>
(function () {
  function fixVimeo() {
    var frame = document.querySelector('.w-lightbox-backdrop iframe');
    if (!frame) return false;
    var src = frame.getAttribute('src') || '';
    if (src.indexOf('player.vimeo.com') > -1 && src.indexOf('autoplay=1') > -1) return true;
    var m = src.match(/player\.vimeo\.com(?:%2F|\/)video(?:%2F|\/)(\d+)/) ||
            src.match(/vimeo\.com(?:%2F|\/)(\d+)/);
    if (m) {
      frame.setAttribute('src', 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1');
      return true;
    }
    return false;
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.w-lightbox')) return;
    var tries = 0;
    var iv = setInterval(function () {
      if (fixVimeo() || ++tries > 60) clearInterval(iv);
    }, 50);
  });
})();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const year = new Date().getFullYear();
    document.querySelectorAll(".text-year").forEach(el => {
      el.textContent = year;
    });

    const backToTop = document.querySelector(".back-to-top");

    window.addEventListener("scroll", function () {
      const scrollPosition = window.scrollY;
      const triggerPoint = window.innerHeight;

      if (scrollPosition > triggerPoint) {
        backToTop.classList.add("show");
      } else {
        backToTop.classList.remove("show");
      }
    });
  });
</script>
