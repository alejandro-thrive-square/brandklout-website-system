<script>
/* ---------- scroll progress rail lighting the three call steps ---------- */
(function(){
  var wrap = document.querySelector('[data-ty-steps]');
  if (!wrap || wrap.dataset.tyInit) return;
  wrap.dataset.tyInit = '1';
  var fill  = wrap.querySelector('[data-ty-rail-fill]');
  var steps = [].slice.call(wrap.querySelectorAll('[data-ty-step]'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce){
    fill.style.height = '100%';
    steps.forEach(function(s){ s.classList.add('is--lit'); });
    return;
  }

  var seen = false, queued = false;
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ seen = es[0].isIntersecting; }).observe(wrap);
  } else { seen = true; }

  function draw(){
    queued = false;
    if (!seen) return;
    var r  = wrap.getBoundingClientRect();
    var vh = window.innerHeight || 800;
    /* p = 0 when the block's top sits at 80% of the viewport, p = 1 when its
       BOTTOM reaches 35%. Deriving the denominator from the block's height alone
       collapses to near zero on a short block, which pinned the rail at 100%
       from the first frame. Adding the viewport travel keeps the scrub honest at
       any block height. */
    var travel = vh * 0.45 + r.height;
    var p = (vh * 0.80 - r.top) / travel;
    p = Math.max(0, Math.min(1, p));
    fill.style.height = (p * 100) + '%';
    var railTop = wrap.querySelector('.ty-steps__rail').getBoundingClientRect().top;
    var lit = railTop + (p * wrap.querySelector('.ty-steps__rail').offsetHeight);
    steps.forEach(function(s){
      var n = s.querySelector('.ty-step__num').getBoundingClientRect();
      s.classList.toggle('is--lit', (n.top + n.height / 2) <= lit + 4);
    });
  }
  function onScroll(){ if (!queued){ queued = true; requestAnimationFrame(draw); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  draw();
})();
</script>
<script>
/* ---------- FAQ accordion: exactly one item open ---------- */
(function(){
  var list = document.querySelector('[data-ty-faq]');
  if (!list || list.dataset.tyInit) return;
  list.dataset.tyInit = '1';

  function close(item){
    item.classList.remove('is--open');
    item.querySelector('.ty-faq__trigger').setAttribute('aria-expanded', 'false');
    item.querySelector('.ty-faq__panel').style.height = '0px';
  }
  function open(item){
    item.classList.add('is--open');
    item.querySelector('.ty-faq__trigger').setAttribute('aria-expanded', 'true');
    var panel = item.querySelector('.ty-faq__panel');
    panel.style.height = panel.scrollHeight + 'px';
  }
  function toggle(item){
    var isOpen = item.classList.contains('is--open');
    [].slice.call(list.querySelectorAll('.ty-faq__item')).forEach(close);
    if (!isOpen) open(item);
  }

  list.addEventListener('click', function(e){
    var t = e.target.closest('.ty-faq__trigger');
    if (t) toggle(t.closest('.ty-faq__item'));
  });
  list.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target.closest('.ty-faq__trigger');
    if (!t) return;
    e.preventDefault();
    toggle(t.closest('.ty-faq__item'));
  });
  window.addEventListener('resize', function(){
    var openItem = list.querySelector('.ty-faq__item.is--open');
    if (openItem){
      var p = openItem.querySelector('.ty-faq__panel');
      p.style.height = p.scrollHeight + 'px';
    }
  });
  /* panels start closed in CSS, so nothing is hidden that JS then has to reveal */
})();
</script>
<script>
/* ---------- credential marquee + reveals ---------- */
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* measure and start immediately, re-measure as images arrive: waiting on
     window load stalls forever if one CDN asset is slow */
  var vp = document.querySelector('[data-ty-marks]');
  if (vp && !vp.dataset.tyInit){
    vp.dataset.tyInit = '1';
    var track = vp.querySelector('[data-ty-marks-track]');
    var x = 0, half = 0, on = false;
    function measure(){ half = track.scrollWidth / 2; }
    measure();
    [].slice.call(track.querySelectorAll('img')).forEach(function(i){
      if (!i.complete) i.addEventListener('load', measure, { once: true });
    });
    function step(){
      if (on && half > 0){
        x -= 0.4;
        if (-x >= half) x += half;
        track.style.transform = 'translate3d(' + x + 'px,0,0)';
      }
      requestAnimationFrame(step);
    }
    if ('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ on = es[0].isIntersecting && !reduce; }).observe(vp);
    } else { on = !reduce; }
    vp.addEventListener('mouseenter', function(){ on = false; });
    vp.addEventListener('mouseleave', function(){ on = !reduce; });
    if (!reduce) requestAnimationFrame(step);
  }

  /* reveals. Nothing is CSS hidden in the static sheet: the reveal attribute
     is applied by JS, so the page reads fine with JS off. */
  var targets = [].slice.call(document.querySelectorAll(
    '.ty-expect__head, .ty-step, [data-ty-risk], [data-ty-reassure], .ty-why__head, [data-ty-card], .ty-faq__head, .ty-faq__item, .ty-cta__card'
  ));
  if (!targets.length) return;
  targets.forEach(function(t){ t.setAttribute('data-ty-reveal', ''); });
  if (reduce || !('IntersectionObserver' in window)){
    targets.forEach(function(t){ t.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      var el = en.target;
      var idx = [].slice.call(el.parentNode.children).indexOf(el);
      el.style.transitionDelay = Math.min(idx, 5) * 85 + 'ms';
      el.classList.add('in');
      io.unobserve(el);
    });
  }, { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
  targets.forEach(function(t){ io.observe(t); });
})();
</script>
