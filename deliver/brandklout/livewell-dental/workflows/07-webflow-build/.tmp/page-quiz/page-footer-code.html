<script>
/* ---------- the quiz ---------- */
(function(){
  var card = document.querySelector('[data-qz-card]');
  if (!card || card.dataset.qzInit) return;
  card.dataset.qzInit = '1';

  var steps  = [].slice.call(card.querySelectorAll('[data-qz-step]'));
  var fill   = card.querySelector('[data-qz-fill]');
  var count  = card.querySelector('[data-qz-count]');
  var back   = card.querySelector('[data-qz-back]');
  var next   = card.querySelector('[data-qz-next]');
  var nav    = card.querySelector('[data-qz-nav]');
  var err    = card.querySelector('[data-qz-err]');
  var done   = card.querySelector('[data-qz-done]');
  var total  = steps.length;
  var at     = 0;
  var answers = {};

  function show(i){
    steps.forEach(function(s, n){
      s.classList.toggle('is--visible', n === i);
      if (n === i){ s.classList.remove('is--in'); void s.offsetWidth; s.classList.add('is--in'); }
    });
    at = i;
    fill.style.width = Math.round(((i + 1) / total) * 100) + '%';
    count.textContent = (i + 1) + ' / ' + total;
    back.classList.toggle('is--off', i === 0);
    next.firstChild.nodeValue = (i === total - 1) ? 'See my results ' : 'Next ';
    err.classList.remove('is--visible');
  }

  /* option picking */
  card.addEventListener('click', function(e){
    var opt = e.target.closest('.qz-opt');
    if (!opt || !card.contains(opt)) return;
    var step = opt.closest('[data-qz-step]');
    var many = step.getAttribute('data-qz-mode') === 'many';
    if (!many) {
      step.querySelectorAll('.qz-opt').forEach(function(o){ o.classList.remove('is--picked'); });
      opt.classList.add('is--picked');
    } else {
      opt.classList.toggle('is--picked');
    }
    err.classList.remove('is--visible');
    answers['q' + step.getAttribute('data-qz-step')] =
      [].slice.call(step.querySelectorAll('.qz-opt.is--picked'))
        .map(function(o){ return o.getAttribute('data-qz-opt'); });
  });

  /* consent */
  var consent = card.querySelector('[data-qz-consent]');
  function toggleConsent(){
    var on = !consent.classList.contains('is--picked');
    consent.classList.toggle('is--picked', on);
    consent.setAttribute('aria-checked', on ? 'true' : 'false');
    err.classList.remove('is--visible');
  }
  if (consent){
    consent.addEventListener('click', toggleConsent);
    consent.addEventListener('keydown', function(e){
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggleConsent(); }
    });
  }

  function valid(){
    var step = steps[at];
    var mode = step.getAttribute('data-qz-mode');
    if (mode === 'form'){
      var ok = true;
      step.querySelectorAll('[data-qz-req]').forEach(function(f){
        var bad = !f.value.trim() ||
          (f.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(f.value.trim())) ||
          (f.type === 'tel' && f.value.replace(/\D/g, '').length < 10);
        f.classList.toggle('is--bad', bad);
        if (bad) ok = false;
        else answers[f.getAttribute('data-qz-name')] = f.value.trim();
      });
      if (!ok){ err.textContent = 'Please check the highlighted fields.'; return false; }
      if (consent && !consent.classList.contains('is--picked')){
        err.textContent = 'Please agree to be contacted so we can send your results.';
        return false;
      }
      return true;
    }
    if (!step.querySelector('.qz-opt.is--picked')){
      err.textContent = 'Please choose an answer to continue.';
      return false;
    }
    return true;
  }

  next.addEventListener('click', function(){
    if (!valid()){ err.classList.add('is--visible'); return; }
    if (at < total - 1){ show(at + 1); return; }
    /* finish: no backend yet, see the in-page flag on step 11 */
    steps.forEach(function(s){ s.classList.remove('is--visible'); });
    nav.style.display = 'none';
    err.classList.remove('is--visible');
    done.classList.add('is--visible');
    fill.style.width = '100%';
    card.setAttribute('data-qz-answers', JSON.stringify(answers));
  });

  back.addEventListener('click', function(){ if (at > 0) show(at - 1); });

  /* role="button" divs replaced native <button> so the payload stays native
     Webflow elements; that means activation keys have to be wired by hand. */
  card.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.classList.contains('qz-field__input')){
      e.preventDefault(); next.click(); return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var hit = e.target.closest('[role="button"]');
    if (!hit || !card.contains(hit)) return;
    e.preventDefault();
    hit.click();
  });

  var formEl = card.querySelector('[data-qz-form]');
  if (formEl) formEl.addEventListener('submit', function(e){ e.preventDefault(); next.click(); });

  show(0);
})();
</script>
<script>
/* ---------- story rail: drag, drift, click to play ---------- */
(function(){
  var rail = document.querySelector('[data-qz-rail]');
  if (!rail || rail.dataset.qzInit) return;
  rail.dataset.qzInit = '1';
  var track = rail.querySelector('[data-qz-track]');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* pointer drag */
  var down = false, startX = 0, startScroll = 0;
  rail.style.overflowX = 'auto';
  rail.style.scrollbarWidth = 'none';
  rail.addEventListener('pointerdown', function(e){
    if (e.target.closest('.qz-story__play')) return;
    down = true; startX = e.clientX; startScroll = rail.scrollLeft;
    rail.classList.add('is--dragging');
    rail.setPointerCapture(e.pointerId);
  });
  rail.addEventListener('pointermove', function(e){
    if (!down) return;
    rail.scrollLeft = startScroll - (e.clientX - startX);
    pos = rail.scrollLeft;
  });
  ['pointerup','pointercancel'].forEach(function(t){
    rail.addEventListener(t, function(){ down = false; rail.classList.remove('is--dragging'); });
  });

  /* Gentle drift until the visitor takes over, IO gated. The offset is kept in
     a JS accumulator and written whole each frame: Chrome rounds scrollLeft to
     integers, so `scrollLeft += 0.35` reads back as 0 every frame and the drift
     never moves at all. Verified with a CDP probe. */
  var drifting = !reduce, raf = 0, seen = false, pos = 0, dir = 1;
  ['pointerdown','wheel','touchstart'].forEach(function(t){
    rail.addEventListener(t, function(){ drifting = false; }, { passive: true });
  });
  function tick(){
    if (drifting && seen){
      var max = track.scrollWidth - rail.clientWidth;
      if (max > 0){
        pos += 0.35 * dir;
        if (pos >= max){ pos = max; dir = -1; }
        if (pos <= 0){ pos = 0; dir = 1; }
        rail.scrollLeft = pos;
      }
    }
    raf = requestAnimationFrame(tick);
  }
  if ('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ seen = es[0].isIntersecting; })
      .observe(rail);
  } else { seen = true; }
  if (!reduce) raf = requestAnimationFrame(tick);

  /* click to play: no iframe or video tag ships in the markup */
  rail.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var k = e.target.closest('.qz-story__play');
    if (k){ e.preventDefault(); k.click(); }
  });
  rail.addEventListener('click', function(e){
    var btn = e.target.closest('.qz-story__play');
    if (!btn) return;
    var stage = btn.closest('.qz-story__stage');
    if (!stage || stage.classList.contains('is--playing')) return;
    drifting = false;
    var kind = stage.getAttribute('data-qz-video');
    var src  = stage.getAttribute('data-qz-src');
    var el;
    if (kind === 'vimeo'){
      el = document.createElement('iframe');
      el.className = 'qz-story__frame';
      el.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
      el.setAttribute('title', 'Livewell Dental patient story');
      el.src = 'https://player.vimeo.com/video/' + src + '?autoplay=1';
    } else {
      el = document.createElement('video');
      el.className = 'qz-story__frame';
      el.controls = true; el.autoplay = true; el.playsInline = true;
      el.src = src;
    }
    stage.appendChild(el);
    stage.classList.add('is--playing');
  });
})();
</script>
<script>
/* ---------- credential marquee + drifting type + reveals ---------- */
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* credential marquee. Measure and start immediately, then re-measure as
     images arrive: waiting on window load stalls forever if one CDN asset
     is slow, which is what killed both marquees on the cosmetic page. */
  var vp = document.querySelector('[data-qz-marks]');
  if (vp && !vp.dataset.qzInit){
    vp.dataset.qzInit = '1';
    var track = vp.querySelector('[data-qz-marks-track]');
    var x = 0, half = 0, raf = 0, on = false;
    function measure(){ half = track.scrollWidth / 2; }
    measure();
    [].slice.call(track.querySelectorAll('img')).forEach(function(i){
      if (!i.complete) i.addEventListener('load', measure, { once: true });
    });
    function step(){
      if (on && half > 0){
        x -= 0.42;
        if (-x >= half) x += half;
        track.style.transform = 'translate3d(' + x + 'px,0,0)';
      }
      raf = requestAnimationFrame(step);
    }
    if ('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ on = es[0].isIntersecting && !reduce; }).observe(vp);
    } else { on = !reduce; }
    vp.addEventListener('mouseenter', function(){ on = false; });
    vp.addEventListener('mouseleave', function(){ on = !reduce; });
    if (!reduce) raf = requestAnimationFrame(step);
  }

  /* oversized type drift behind the proof band */
  var drift = document.querySelector('[data-qz-drift]');
  if (drift && !drift.dataset.qzInit && !reduce){
    drift.dataset.qzInit = '1';
    var d = 0, dw = 0, dOn = false;
    function dm(){ dw = drift.scrollWidth / 2; }
    dm();
    if ('IntersectionObserver' in window){
      new IntersectionObserver(function(es){ dOn = es[0].isIntersecting; }).observe(drift);
    } else { dOn = true; }
    (function dstep(){
      if (dOn && dw > 0){
        d -= 0.22;
        if (-d >= dw) d += dw;
        drift.style.transform = 'translateY(-50%) translate3d(' + d + 'px,0,0)';
      }
      requestAnimationFrame(dstep);
    })();
  }

  /* scroll reveals. Content is never CSS hidden in the static sheet:
     the reveal class is applied by JS, so the page reads fine with JS off. */
  var targets = [].slice.call(document.querySelectorAll(
    '.qz-stories__head, .qz-story, .qz-proof__in, .qz-stories__foot'
  ));
  if (!targets.length) return;
  targets.forEach(function(t){ t.setAttribute('data-qz-reveal', ''); });
  if (reduce || !('IntersectionObserver' in window)){
    targets.forEach(function(t){ t.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      var el = en.target;
      var sibs = [].slice.call(el.parentNode.children).indexOf(el);
      el.style.transitionDelay = Math.min(sibs, 4) * 90 + 'ms';
      el.classList.add('in');
      io.unobserve(el);
    });
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
  targets.forEach(function(t){ io.observe(t); });
})();
</script>
