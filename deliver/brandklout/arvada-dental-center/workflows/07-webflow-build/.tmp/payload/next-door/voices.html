<h1>Copy component for Webflow</h1>
<p>Click the button, then switch to the Webflow Designer, click on the canvas,
and press <code>Ctrl/Cmd&nbsp;+&nbsp;V</code>.</p>
<p><button id="btn">Copy to Webflow clipboard</button>
