<script>
/* aox-page.js: loaded on all three pages (landing, consult, thank-you).
   Click tracking for phone, video and prequalify links; the patient video
   lightbox; and the thank-you page's first-name greeting. The quiz itself
   lives in aox-quiz.js. */
(function(){
  'use strict';

  var PREQUAL_URL = 'https://pay.withcherry.com/arvada-dental-center--implants';
  window.dataLayer = window.dataLayer || [];
  function track(event, data){
    try { var o = { event: event }; if (data) for (var k in data) o[k] = data[k]; window.dataLayer.push(o); } catch (e) {}
  }

  /* ===== Patient video lightbox =====
     A face tile is a plain link to YouTube, so it still works with scripts
     off. With scripts on, the video opens over the page and the visitor
     stays. No player exists until a tile is clicked. */
  var dlg = null, frame = null, lastTile = null;
  function buildDialog(){
    dlg = document.createElement('dialog');
    dlg.className = 'aq-vid';
    dlg.setAttribute('aria-label', 'Patient story video');
    dlg.innerHTML = '<button type="button" class="aq-vid-x" aria-label="Close video">&times;</button><div class="aq-vid-frame"></div>';
    document.body.appendChild(dlg);
    frame = dlg.querySelector('.aq-vid-frame');
    dlg.querySelector('.aq-vid-x').addEventListener('click', function(){ dlg.close(); });
    dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', function(){
      frame.innerHTML = '';
      if (lastTile) lastTile.focus({ preventScroll: true });
    });
  }
  function openVideo(id, title, tile){
    if (!dlg) buildDialog();
    lastTile = tile;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&playsinline=1';
    f.title = title || 'Patient story';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    frame.appendChild(f);
    dlg.showModal();
  }

  document.addEventListener('click', function(e){
    if (!e.target.closest) return;
    var a = e.target.closest('a[href^="tel:"]');
    if (a) track('phone_click', { cta_location: a.getAttribute('data-loc') || '' });
    var pq = e.target.closest('a[href="' + PREQUAL_URL + '"]');
    if (pq) track('prequal_click', { cta_location: pq.getAttribute('data-loc') || '' });
    var v = e.target.closest('a[data-yt]');
    if (v) {
      var id = v.getAttribute('data-yt');
      track('video_click', { video_id: id });
      /* Modified clicks (new tab) and browsers without <dialog> keep the plain link. */
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button || !window.HTMLDialogElement) return;
      e.preventDefault();
      openVideo(id, v.getAttribute('aria-label'), v);
    }
  });

  /* ===== Thank-you page =====
     The quiz leaves the first name in sessionStorage, never in the URL, so no
     personal detail reaches analytics or the browser history. */
  var ty = document.getElementById('ty-title');
  if (ty) {
    try {
      var lead = JSON.parse(sessionStorage.getItem('aox_lead') || 'null');
      if (lead && lead.first_name) ty.textContent = 'Request received, ' + lead.first_name + '.';
    } catch (e) {}
  }
})();
</script>
<script>
(function(){
  'use strict';

  /* ===== Setup =====
     Paste your GoHighLevel / LeadConnector inbound webhook URL below when installing.
     Leave it empty to preview the flow without sending anything. */
  var LEAD_WEBHOOK_URL = '';
  var PHONE = { display: '(720) 419-3699', tel: '+17204193699' };
  var PREQUAL_URL = 'https://pay.withcherry.com/arvada-dental-center--implants';
  var PRICE = { one: { total: '$18,795', mo: '$235' }, both: { total: '$37,590', mo: '$471' } };

  /* Headline variants for ad message match: add ?hl=dentures (or failing, price, monthly) to the ad's final URL */
  var HEADLINES = {
    dentures: 'Done with dentures? Fixed teeth in a day.',
    failing: 'Failing teeth? Leave with a fixed smile the same day.',
    price: 'Full-arch implants for $18,795 per arch, in writing.',
    monthly: 'Fixed teeth in a day, from $235 a month.'
  };

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.dataLayer = window.dataLayer || [];
  function track(event, data){
    try { var o = { event: event }; if (data) for (var k in data) o[k] = data[k]; window.dataLayer.push(o); } catch (e) {}
  }

  var params = new URLSearchParams(location.search);
  var hl = params.get('hl');
  var hlEl = document.getElementById('hl');
  if (hl && HEADLINES[hl] && hlEl) hlEl.textContent = HEADLINES[hl];

  var attribution = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid','hl'].forEach(function(k){
    var v = params.get(k); if (v) attribution[k] = v;
  });

  var STEPS = [
    { key: 'situation', q: 'What’s going on with your teeth right now?',
      opts: ['I’m missing most or all of my teeth', 'I have several failing or broken teeth', 'I wear dentures and I’m tired of them', 'I’m not sure, I’d like an expert opinion'] },
    { key: 'arch', q: 'Which teeth would you like to replace?',
      opts: ['My upper teeth', 'My lower teeth', 'Both upper and lower', 'I’m not sure yet'] },
    { key: 'timeline', q: 'When would you like to have new teeth?',
      opts: ['As soon as possible', 'Within the next 3 months', 'In 3 to 6 months', 'I’m just researching for now'] },
    { key: 'payment', q: 'How would you like to pay for treatment?',
      opts: ['Monthly payments', 'Cash or savings', 'Insurance plus financing', 'I’d like to talk it through'] }
  ];

  var answers = {}, idx = 0, started = false, advancing = false, sending = false;
  var contact = { first_name: '', phone: '', email: '', sms_consent: false };
  var quiz = document.getElementById('quiz');
  var body = document.getElementById('quiz-body');
  var fill = document.getElementById('q-fill');
  var count = document.getElementById('q-count');
  var bar = quiz.querySelector('.aq-track');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; });
  }

  function setProgress(){
    var total = STEPS.length + 2;
    var pct = Math.round((Math.min(idx, STEPS.length + 1) + 1) / total * 100);
    fill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', pct);
    count.textContent = idx < STEPS.length ? 'Question ' + (idx + 1) + ' of ' + STEPS.length
      : (idx === STEPS.length ? 'Last step' : 'All done');
  }

  function foot(showBack){
    return '<div class="aq-quiz-foot">' + (showBack ? '<button type="button" class="aq-back">Back</button>' : '<span></span>') +
      '<span class="aq-time">Takes about 30 seconds</span></div>';
  }

  function field(id, label, type, ac, val, ph, optional){
    return '<div class="aq-field"><label for="' + id + '">' + label + (optional ? ' <span class="aq-opt-l">(optional)</span>' : '') + '</label>' +
      '<input id="' + id + '" type="' + type + '" autocomplete="' + ac + '"' +
      (type === 'tel' ? ' inputmode="tel"' : '') + (type === 'email' ? ' inputmode="email"' : '') +
      ' value="' + esc(val) + '"' + (ph ? ' placeholder="' + ph + '"' : '') + (optional ? '' : ' required') +
      ' aria-describedby="' + id + '-err">' +
      '<p class="aq-err" id="' + id + '-err" hidden></p></div>';
  }

  function contactHTML(){
    var a = answers.arch || '';
    var both = a === 'Both upper and lower';
    var label = both ? 'both arches' : (a === 'My upper teeth' ? 'upper arch' : (a === 'My lower teeth' ? 'lower arch' : 'one arch'));
    var p = both ? PRICE.both : PRICE.one;
    return '<div class="aq-step">' +
      '<h3 class="aq-q" tabindex="-1">Your next step is a free consultation and 3D scan.</h3>' +
      '<div class="aq-est"><p class="aq-est-l">Published fee, ' + label + '</p><p class="aq-est-n">' + p.total + '</p>' +
      '<p class="aq-est-m">or from ' + p.mo + '/mo with approved financing. Confirmed in writing after your scan.</p></div>' +
      '<form id="lead-form" novalidate>' +
        field('f-name', 'First name', 'text', 'given-name', contact.first_name, '', false) +
        field('f-phone', 'Mobile phone', 'tel', 'tel-national', contact.phone, '(303) 555-0123', false) +
        field('f-email', 'Email', 'email', 'email', contact.email, '', true) +
        '<label class="aq-check"><input type="checkbox" id="f-sms"' + (contact.sms_consent ? ' checked' : '') + '>' +
        '<span>Text me about my consultation. Message and data rates may apply. Reply STOP to opt out. Consent isn’t required to book.</span></label>' +
        '<button class="aq-btn aq-btn-gold aq-btn-block" type="submit">Request my free consultation</button>' +
        '<p class="aq-form-err" id="form-err" role="alert" hidden></p>' +
        '<p class="aq-fine">No cost and no obligation. Our implant coordinator will call you.</p>' +
      '</form>' + foot(true) + '</div>';
  }

  function doneHTML(){
    return '<div class="aq-step aq-done">' +
      '<svg class="aq-done-icon" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15 27l7 7 15-16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<h3 class="aq-q" tabindex="-1">Request received, ' + esc(contact.first_name) + '.</h3>' +
      '<p>Our implant coordinator will call you to set your free consultation.</p>' +
      '<p class="aq-muted">Office hours are Monday to Friday, 8am to 5pm. Requests sent after hours get a call the next business morning.</p>' +
      '<a class="aq-btn aq-btn-line aq-btn-block" href="tel:' + PHONE.tel + '" data-loc="quiz_done">Call now instead</a>' +
      '<p class="aq-prequal">Want to know your monthly payment before your visit? <a href="' + PREQUAL_URL + '" target="_blank" rel="noopener" data-loc="quiz_done">Prequalify with Cherry</a>.</p></div>';
  }

  function render(moveFocus){
    setProgress();
    if (idx < STEPS.length) {
      var s = STEPS[idx];
      body.innerHTML = '<fieldset class="aq-step"><legend class="aq-q" tabindex="-1">' + esc(s.q) + '</legend><div class="aq-opts">' +
        s.opts.map(function(o, j){
          return '<button type="button" class="aq-opt" data-j="' + j + '" aria-pressed="' + (answers[s.key] === o) + '">' + esc(o) + '</button>';
        }).join('') + '</div></fieldset>' + foot(idx > 0);
    } else if (idx === STEPS.length) {
      body.innerHTML = contactHTML();
    } else {
      body.innerHTML = doneHTML();
    }
    wire();
    if (moveFocus) {
      var q = body.querySelector('.aq-q');
      if (q) q.focus({ preventScroll: true });
      if (quiz.getBoundingClientRect().top < 0) quiz.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function saveContact(){
    var f = document.getElementById('lead-form'); if (!f) return;
    contact.first_name = f.querySelector('#f-name').value.trim();
    contact.phone = f.querySelector('#f-phone').value.trim();
    contact.email = f.querySelector('#f-email').value.trim();
    contact.sms_consent = f.querySelector('#f-sms').checked;
  }

  function digits(p){
    var d = String(p).replace(/\D/g, '');
    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    return d;
  }

  function showErr(id, msg){
    var input = document.getElementById(id), e = document.getElementById(id + '-err');
    if (msg) { input.setAttribute('aria-invalid', 'true'); e.textContent = msg; e.hidden = false; }
    else { input.removeAttribute('aria-invalid'); e.hidden = true; }
    return !msg;
  }

  function sendLead(payload){
    if (!LEAD_WEBHOOK_URL) {
      var previewHost = /^(localhost|127\.0\.0\.1)$|\.webflow\.io$/.test(location.hostname);
      if (window.console) console.warn('[aox-quiz] LEAD_WEBHOOK_URL is empty: this lead was NOT sent anywhere' + (previewHost ? ' (preview mode).' : '.'));
      return previewHost ? Promise.resolve() : Promise.reject(new Error('no lead webhook configured'));
    }
    return fetch(LEAD_WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true
    }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); });
  }

  function onSubmit(ev){
    ev.preventDefault();
    if (sending) return;
    saveContact();
    var first = null;
    if (!showErr('f-name', contact.first_name ? '' : 'Enter your first name so we know who to ask for.')) first = first || 'f-name';
    var d = digits(contact.phone);
    if (!showErr('f-phone', d.length === 10 ? '' : 'Enter a 10-digit mobile number so our coordinator can reach you.')) first = first || 'f-phone';
    var emailOk = !contact.email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email);
    if (!showErr('f-email', emailOk ? '' : 'Check your email address, or leave it blank.')) first = first || 'f-email';
    if (first) { document.getElementById(first).focus(); track('lead_form_error', { field: first }); return; }

    var btn = ev.target.querySelector('button[type="submit"]');
    var formErr = document.getElementById('form-err');
    formErr.hidden = true;
    sending = true; btn.disabled = true; btn.textContent = 'Sending your request…';

    var payload = {};
    for (var k in answers) payload[k] = answers[k];
    payload.first_name = contact.first_name;
    payload.phone = d;
    payload.email = contact.email;
    payload.sms_consent = contact.sms_consent;
    payload.landing_page = location.origin + location.pathname;
    payload.submitted_at = new Date().toISOString();
    for (var a in attribution) payload[a] = attribution[a];

    sendLead(payload).then(function(){
      track('generate_lead', { quiz_arch: answers.arch, quiz_timeline: answers.timeline, quiz_payment: answers.payment });
      var ty = quiz.getAttribute('data-thank-you');
      if (ty) {
        try { sessionStorage.setItem('aox_lead', JSON.stringify({ first_name: contact.first_name, at: Date.now() })); } catch (e) {}
        /* a short pause lets the tag manager send generate_lead before the page changes */
        setTimeout(function(){ location.assign(ty); }, 350);
        return;
      }
      idx = STEPS.length + 1; sending = false; render(true);
    }).catch(function(){
      sending = false; btn.disabled = false; btn.textContent = 'Request my free consultation';
      formErr.innerHTML = 'Your request didn’t go through. Try again, or call <a href="tel:' + PHONE.tel + '">' + PHONE.display + '</a> and we’ll book you directly.';
      formErr.hidden = false;
    });
  }

  function wire(){
    body.querySelectorAll('.aq-opt').forEach(function(b){
      b.addEventListener('click', function(){
        if (advancing) return;
        var s = STEPS[idx], o = s.opts[+b.getAttribute('data-j')];
        answers[s.key] = o;
        body.querySelectorAll('.aq-opt').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
        if (!started) { started = true; track('quiz_start'); }
        track('quiz_step', { quiz_step: idx + 1, quiz_question: s.key, quiz_answer: o });
        advancing = true;
        setTimeout(function(){ idx++; advancing = false; render(true); }, reduce ? 0 : 170);
      });
    });
    var back = body.querySelector('.aq-back');
    if (back) back.addEventListener('click', function(){ saveContact(); idx = Math.max(0, idx - 1); render(true); });
    var form = document.getElementById('lead-form');
    if (form) {
      var ph = form.querySelector('#f-phone');
      ph.addEventListener('blur', function(){
        var d = digits(ph.value);
        if (d.length === 10) ph.value = '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
      });
      form.addEventListener('submit', onSubmit);
    }
  }

  /* Every "See if I qualify" button scrolls to the quiz and keeps the visitor's place */
  document.querySelectorAll('.aq-js-to-quiz').forEach(function(b){
    b.addEventListener('click', function(){
      track('cta_click', { cta_location: b.getAttribute('data-loc') || '' });
      quiz.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      setTimeout(function(){ var q = body.querySelector('.aq-q'); if (q) q.focus({ preventScroll: true }); }, reduce ? 0 : 450);
    });
  });

  /* Sticky mobile bar appears once the quiz and final call to action are out of view */
  var sticky = document.getElementById('sticky');
  var finalSec = document.getElementById('final');
  if (sticky && finalSec && 'IntersectionObserver' in window) {
    var quizVisible = true, finalVisible = false;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.target === quiz) quizVisible = en.isIntersecting; else finalVisible = en.isIntersecting;
      });
      sticky.classList.toggle('aq-show', !quizVisible && !finalVisible);
    }, { threshold: 0.12 });
    io.observe(quiz); io.observe(finalSec);
  }

  render(false);
})();
</script>
