<!-- The two typefaces are SELF-HOSTED, in assets/fonts/, declared by
     css/03-fonts.css and therefore already inside assets/site.css. There is no
     request to fonts.googleapis.com: this is a medical practice, and a
     third-party stylesheet on every page view hands Google the IP of everyone
     who visits. Same decision, same files, as the Surgical Arts build. -->
<link rel="preload" href="assets/fonts/cormorant-garamond-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<!-- Every scroll-reveal rule in the stylesheet is scoped to .js, and this sets
     it, inline and in the head so it lands before first paint. The timer is the
     safety net: reveals start at opacity 0, so if site.js never boots the class
     comes off at 2.5s and the whole page paints, unanimated. A site with no
     animation is fine; a site with no content is not. -->
<script>
  document.documentElement.classList.add('js');
  setTimeout(function () {
    if (!window.__smsBooted) document.documentElement.classList.remove('js');
  }, 2500);
</script>
