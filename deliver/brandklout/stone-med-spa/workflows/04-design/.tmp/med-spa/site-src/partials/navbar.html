     from the drawer and the footer, where there is room for everything.

     `{{CUR_<SLUG>}}` expands to `aria-current="page"` on that page and to
     nothing everywhere else; build-site.mjs matches the token against the page
     slug, lower-cased with underscores turned into hyphens. -->
