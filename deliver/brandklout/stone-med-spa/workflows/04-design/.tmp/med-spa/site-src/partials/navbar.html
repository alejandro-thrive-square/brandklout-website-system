<!-- The navbar. Five links, the phone and the book button.

     WHY THESE FIVE. A med spa sells a routine rather than an operation, so
     Membership and Results sit in the bar instead of being buried. "Our team"
     replaced "Dr. Stone" on 2026-09-15: the client's feedback is that patients
     are seen and treated by the practice's own providers, not by Dr. Stone, so
     the bar leads to the people who actually treat you. Dr. Stone, Financing
     and the rest are in the drawer and the footer.

     `{{CUR_<SLUG>}}` expands to `aria-current="page"` on that page and to
     nothing everywhere else; build-site.mjs matches the token against the page
     slug, lower-cased with underscores turned into hyphens. -->
<header class="navbar_component{{NAV_MODE}}" data-nav>
  <span class="navbar_progress" aria-hidden="true"></span>
  <div class="padding-global">
    <div class="container-large">
      <div class="navbar_container">
        <a class="navbar_logo-link" href="index.html" aria-label="Westlake Medical Aesthetics, home">
          <span class="brand_component">
            <span class="brand_name">Westlake</span>
            <span class="brand_rule"><span class="brand_sub">Medical Aesthetics</span></span>
          </span>
        </a>

        <nav class="navbar_menu" aria-label="Primary">
          <a class="navbar_link" href="treatments.html"{{CUR_TREATMENTS}}>Treatments</a>
          <a class="navbar_link" href="results.html"{{CUR_RESULTS}}>Results</a>
          <a class="navbar_link" href="membership.html"{{CUR_MEMBERSHIP}}>Membership</a>
          <a class="navbar_link" href="team.html"{{CUR_TEAM}}>Our team</a>
          <a class="navbar_link" href="about.html"{{CUR_ABOUT}}>About</a>

        <div class="navbar_actions">
          <a class="navbar_phone" href="tel:+18179183666">
