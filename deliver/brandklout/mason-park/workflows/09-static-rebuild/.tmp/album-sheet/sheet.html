<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#fff;font:12px/1 sans-serif}.g{display:grid;grid-template-columns:repeat(8,180px);gap:6px;padding:6px;width:max-content}.g figure{margin:0;position:relative;width:180px;height:150px;background:#eee}.g img{width:100%;height:100%;object-fit:cover;display:block}.g b{position:absolute;left:0;top:0;background:#000;color:#fff;padding:2px 5px;font-size:13px}</style><div class="g" id="g"></div><script>const g=document.getElementById('g');for(let i=1;i<=212;i++){const n=String(i).padStart(3,'0');g.insertAdjacentHTML('beforeend',`<figure><img src="${n}.jpg"><b>${i}</b></figure>`)}</script>
