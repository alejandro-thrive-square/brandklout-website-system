<style>
/* Fluid root font-size - webzite-house-v1. Generated by scripts/fluid-root.mjs; do not hand-edit.
   Lives here, not as a Webflow class: the style panel cannot parse calc()/clamp() and shows 0px. */
:root{--font-from:18;--font-to:20;--vw-from:calc(1920 / 100);--vw-to:calc(2400 / 100);--coefficient:calc((var(--font-to) - var(--font-from)) / (var(--vw-to) - var(--vw-from)));--base:calc((var(--font-from) - var(--vw-from) * var(--coefficient)) / 16)}
html{font-size:calc(var(--base) * 1rem + var(--coefficient) * 1vw)}
@media screen and (max-width:1920px){:root{--font-from:16;--font-to:18;--vw-from:calc(1440 / 100);--vw-to:calc(1920 / 100)}}
@media screen and (max-width:1440px){:root{--font-from:16;--font-to:16;--vw-from:calc(479 / 100);--vw-to:calc(1440 / 100)}}
@media screen and (max-width:479px){:root{--font-from:12;--font-to:16;--vw-from:calc(320 / 100);--vw-to:calc(479 / 100)}}
html{-webkit-text-size-adjust:100%}
/* body-only, never html,body: overflow on <html> makes the window stop being the
   scroller and ScrollTrigger cannot see past it. clip, not hidden, for the same reason. */
body{margin:0;overflow-x:clip}
body.is-locked{overflow:hidden}
/* --bar-h is measured and written by the runtime, so this cannot be a baked class:
   the resolver would freeze it at 0 and the call bar would cover the last chapter. */
@media (max-width:859px){body{padding-bottom:var(--bar-h)}}
/* Pre-paint guard and runtime state. Ancestor-scoped and attribute selectors -
   Webflow classes cannot express either, so they live here. */
.mpd-armed [data-anim="hide"]{visibility:hidden}
.mpd-ready [data-anim="hide"]{visibility:visible}
.mpd-line{will-change:transform}
.site-head.is-solid.is-solid{background:rgba(255,255,255,.95);border-bottom-color:#dfe4e6;box-shadow:0 10px 30px -24px rgba(27,34,36,.5)}
.site-head.is-solid .wrap{padding-block:.6rem}
.offer-rail.is-up.is-up{transform:translate(-50%,0);opacity:1}
.faq details.is-open .answer-wrap{grid-template-rows:1fr}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}[data-anim="hide"]{visibility:visible!important}.offer-rail{opacity:1;transform:translate(-50%,0)}.head-progress i{transform:scaleX(0)}}
</style>
