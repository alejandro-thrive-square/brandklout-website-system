<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paste into Webflow</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;color:#111}
  button{font-size:1.1rem;padding:.9rem 1.6rem;border:0;border-radius:.5rem;
          background:#1463ff;color:#fff;cursor:pointer}
  button:active{transform:translateY(1px)}
  .ok{color:#0a7d28;font-weight:600}
  code{background:#f0f0f3;padding:.1rem .3rem;border-radius:.25rem}
  small{color:#666}
</style>
</head>
<body>
<h1>Copy component for Webflow</h1>
<p>Click the button, then switch to the Webflow Designer, click on the canvas,
and press <code>Ctrl/Cmd&nbsp;+&nbsp;V</code>.</p>
<p><button id="btn">Copy to Webflow clipboard</button>
   <span id="status"></span></p>
<p><small>Writes the payload under the <code>application/json</code> MIME type
   Webflow's paste handler reads.</small></p>
<script type="application/json" id="payload">{"type":"@webflow/XscpData","payload":{"nodes":[{"_id":"a16f9392-958c-4ae0-8d3d-96897d920e3b","type":"Block","tag":"div","classes":["ad219ac3-efac-4a1f-8dfe-f1f5c52ffcbc"],"children":["899e0f14-de3e-4abd-ad3d-481bcad15634"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}},{"_id":"899e0f14-de3e-4abd-ad3d-481bcad15634","type":"Block","tag":"div","classes":["ff1b055f-c278-4fc3-9e92-29fd5443a542","57758467-9815-42fb-9e8a-08cdd8e0e314"],"children":[],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":"progressBar"},"xattr":[],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}}],"styles":[{"_id":"ad219ac3-efac-4a1f-8dfe-f1f5c52ffcbc","fake":false,"type":"class","name":"progress","namespace":"","comb":"","styleLess":"box-sizing: border-box; margin-top: 0; margin-right: 0; margin-bottom: 0; margin-left: 0; background: transparent; color: #3D405B; font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60;","variants":{},"children":[],"origin":null,"selector":null},{"_id":"ff1b055f-c278-4fc3-9e92-29fd5443a542","fake":false,"type":"class","name":"div-invest","namespace":"","comb":"","styleLess":"box-sizing: border-box; height: 100%; width: 0; background: linear-gradient(90deg, #E07A5F, #F2CC8F); transition: width .12s linear;","variants":{},"children":["57758467-9815-42fb-9e8a-08cdd8e0e314"],"origin":null,"selector":null},{"_id":"57758467-9815-42fb-9e8a-08cdd8e0e314","fake":false,"type":"class","name":"bar-invest","namespace":"","comb":"&","styleLess":"","variants":{},"children":[],"origin":null,"selector":null}],"assets":[],"ix1":[],"ix2":{"interactions":[],"events":[],"actionLists":[]}},"meta":{"droppedLinks":0,"dynBindRemovedCount":0,"dynListBindRemovedCount":0,"paginationRemovedCount":0,"universalBindingsRemovedCount":0,"unlinkedSymbolCount":0,"codeComponentsRemovedCount":0,"richTextComponentsStripped":false}}</script>
<script>
  const json = document.getElementById('payload').textContent;
  document.getElementById('btn').addEventListener('click', () => {
    const handler = (e) => {
      e.preventDefault();
      e.clipboardData.setData('application/json', json);
      e.clipboardData.setData('text/plain', json);
    };
    document.addEventListener('copy', handler);
    const ok = document.execCommand('copy');
    document.removeEventListener('copy', handler);
    const s = document.getElementById('status');
    s.textContent = ok ? '\u2713 Copied! Now paste in Webflow.' : 'Copy failed \u2013 try again.';
    s.className = ok ? 'ok' : '';
  });
</script>
</body>
</html>
