<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Copy HEAD CSS (style)</title></head>
<body style="font:15px/1.5 system-ui,sans-serif;max-width:680px;margin:3rem auto;padding:0 1rem">
<h1>Copy HEAD CSS (style)</h1>
<p>Click, then focus the Webflow code field and press Ctrl/Cmd+V.</p>
<button id="btn" style="font-size:1.1rem;padding:.9rem 1.6rem;border:0;border-radius:.5rem;background:#1463ff;color:#fff;cursor:pointer">Copy to clipboard</button>
<span id="status" style="margin-left:1rem;font-weight:600"></span>
<textarea id="payload" style="position:absolute;left:-9999px;top:-9999px">&lt;style&gt;
@import url(&quot;https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap&quot;);
body{background:#F4F1DE;color:#3D405B;font-family:&#x27;Inter&#x27;, -apple-system, sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
nav.top .right .num.num.num{color:rgba(61, 64, 91, 0.65);font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace}
.elevation .scale.scale.scale{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:9px;letter-spacing:0.15em;color:rgba(61, 64, 91, 0.42);z-index:3;border-top:1px solid rgba(61, 64, 91, 0.18);padding-top:8px}
.h-stage .track.dragging.dragging.dragging{cursor:none;scroll-snap-type:none;scroll-behavior:auto}
.h-stage .track.dragging.dragging.dragging .svc{transition:none}
.svc-drag-cursor.active.active.active{opacity:1;transform:translate(-50%, -50%) scale(1)}
.svc-drag-cursor.dragging.dragging.dragging{background:#E07A5F;color:#F4F1DE;transform:translate(-50%, -50%) scale(0.9)}
.about-grid .col-portrait.col-portrait.col-portrait{position:sticky;top:130px}
.portrait-slot.portrait-slot.portrait-slot{position:relative;aspect-ratio:3/4;background:#3D405B;border:1px solid #3D405B;display:grid;place-items:center;overflow:hidden}
.portrait-slot.portrait-slot.portrait-slot &gt; .portrait-slot-before{content:&quot;&quot;;position:absolute;inset:0;background:repeating-linear-gradient(45deg, rgba(61, 64, 91, 0.18) 0 1px, transparent 1px 14px),
        radial-gradient(ellipse at 30% 20%, rgba(224, 122, 95, 0.18), transparent 70%)}
.portrait-slot.portrait-slot.portrait-slot &gt; .portrait-slot-after{content:&quot;PORTRAIT · GIOVANNI · 3:4&quot;;position:relative;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:11px;letter-spacing:0.28em;color:rgba(61, 64, 91, 0.42)}
.portrait-slot.portrait-slot.portrait-slot .label{position:absolute;top:14px;left:14px;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#E07A5F}
.portrait-slot.portrait-slot.portrait-slot .corner{position:absolute;bottom:14px;right:14px;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:10px;color:rgba(61, 64, 91, 0.42);letter-spacing:0.18em}
.shelf.shelf.shelf{margin-top:56px;display:grid;grid-template-columns:repeat(3, 1fr);gap:1px;background:#3D405B;border:1px solid #3D405B}
.shelf.shelf.shelf .item.item.item{background:#F4F1DE;padding:28px;position:relative;display:grid;gap:12px;align-content:start;transition:background .25s}
.shelf.shelf.shelf .item.item.item:hover{background:#EDE8D5}
.shelf.shelf.shelf .item.item.item .ph.ph.ph{height:140px;background:#E5DFCB;border:1px solid rgba(61, 64, 91, 0.18);margin-bottom:8px;position:relative;overflow:hidden}
.shelf.shelf.shelf .item.item.item .ph.ph.ph svg{position:absolute;inset:0;width:100%;height:100%}
.shelf.shelf.shelf .item.item.item .meta{display:flex;justify-content:space-between;align-items:baseline;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#E07A5F}
.shelf.shelf.shelf .item.item.item .meta .id{color:rgba(61, 64, 91, 0.42)}
.shelf.shelf.shelf .item.item.item h4{font-family:&#x27;Lora&#x27;, Georgia, serif;font-weight:700;font-size:22px;margin:4px 0;line-height:1.15;color:#3D405B}
.shelf.shelf.shelf .item.item.item p{font-size:13px;line-height:1.6;color:rgba(61, 64, 91, 0.65);margin:0}
.shelf.shelf.shelf .item.item.item .stat.stat.stat{margin-top:12px;padding-top:12px;border-top:1px solid rgba(61, 64, 91, 0.14);display:flex;justify-content:space-between;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:11px;color:#3D405B}
.shelf.shelf.shelf .item.item.item .stat.stat.stat strong{color:#E07A5F;font-weight:500}
.foot-bar&gt;*:nth-child(3){text-align:right}
.reveal.in.in.in{opacity:1;transform:none}
.reveal-stagger.in.in.in&gt;*{opacity:1;transform:none}
.reveal-stagger.in.in.in&gt;*:nth-child(1){transition-delay:.04s}
.reveal-stagger.in.in.in&gt;*:nth-child(2){transition-delay:.12s}
.reveal-stagger.in.in.in&gt;*:nth-child(3){transition-delay:.20s}
.reveal-stagger.in.in.in&gt;*:nth-child(4){transition-delay:.28s}
.reveal-stagger.in.in.in&gt;*:nth-child(5){transition-delay:.36s}
.reveal-stagger.in.in.in&gt;*:nth-child(6){transition-delay:.44s}
.about-creds-grid.about-creds-grid.about-creds-grid{margin-top:48px;display:flex;flex-wrap:wrap;gap:12px}
.about-cred.about-cred.about-cred{display:flex;align-items:center;gap:10px}
.about-cred-dot.about-cred-dot.about-cred-dot{width:5px;height:5px;border-radius:50%;background:#E07A5F;flex-shrink:0}
.about-cred-text.about-cred-text.about-cred-text{font-size:13px;font-weight:400;color:rgba(61, 64, 91, 0.65)}
section.scene.canvas.canvas.canvas section.prose-block.prose-block.prose-block p{color:rgba(61, 64, 91, 0.65)}
section.scene.canvas.canvas.canvas section.prose-block.prose-block.prose-block p strong{color:#3D405B}
section.scene.canvas.canvas.canvas .prose-story.prose-story.prose-story{font-size:15px;line-height:1.75;color:rgba(61, 64, 91, 0.65);margin:18px 0;max-width:720px}
section.scene.canvas.canvas.canvas .prose-story.prose-story.prose-story strong{color:#3D405B;font-weight:500}
section.scene.canvas.canvas.canvas .prose-story.prose-story.prose-story em{font-style:italic}
.elevation-fx .fx-drift.fx-drift.fx-drift{animation:elev-drift 7s ease-in-out infinite}
.elevation-fx .star.star.star{animation:star-twinkle 4s ease-in-out infinite}
.elevation-fx .star.star.star.s2.s2.s2{animation-duration:2.6s}
.elevation-fx .star.star.star.s3.s3.s3{animation-duration:5.5s}
.elevation-fx .star.star.star.flare.flare.flare{animation:star-flare 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.elevation-fx .star-layer.star-layer.star-layer{animation:star-drift 60s linear infinite}
.elevation-fx .star-layer.star-layer.star-layer.slow.slow.slow{animation-duration:110s}
@media (max-width: 991px){
nav.top .links.open.open.open{display:flex;flex-direction:column;gap:0;position:fixed;top:60px;left:0;right:0;background:#F4F1DE;z-index:48;border-bottom:2px solid #E07A5F;box-shadow:0 8px 24px rgba(61, 64, 91, 0.12)}
nav.top .links.open.open.open a{display:block;padding:14px 24px;border-bottom:1px solid rgba(61, 64, 91, 0.14);font-size:13px}
nav.top .links.open.open.open a &gt; .a-after{display:none}
nav.top .right .num.num.num{display:none}
.about-grid .col-portrait.col-portrait.col-portrait{position:static}
.shelf.shelf.shelf{grid-template-columns:repeat(2, 1fr)}
}
@media (max-width: 767px){
nav.top .links.open.open.open{top:54px}
.shelf.shelf.shelf{grid-template-columns:1fr}
.foot-bar&gt;*:nth-child(3){text-align:left}
nav.top .right .num.num.num{display:none}
}
@media (pointer: coarse){
.svc-drag-cursor{display:none}
}
@keyframes scroll-left{
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }
@keyframes star-twinkle{

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 0.9;
      }
    }
@keyframes star-flare{

      0%,
      100% {
        opacity: 0.45;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.6);
      }
    }
@keyframes star-drift{
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-22px);
      }
    }
@keyframes grid-breathe{

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

&lt;/style&gt;</textarea>
<script>
const txt=document.getElementById('payload').value;
document.getElementById('btn').addEventListener('click',()=>{
  const h=(e)=>{e.preventDefault();e.clipboardData.setData('text/plain',txt);};
  document.addEventListener('copy',h);
  const ok=document.execCommand('copy');
  document.removeEventListener('copy',h);
  const s=document.getElementById('status');
  s.textContent=ok?('\u2713 Copied '+txt.length+' chars'):'copy failed';
});
</script>
</body></html>
