xt>\n<text class=\"sp-fade f4\" fill=\"rgba(244,241,222,0.6)\" font-family=\"JetBrains Mono, monospace\" font-size=\"8\" letter-spacing=\"1\" text-anchor=\"middle\" x=\"300\" y=\"276\">WITHIN $1.08M\u2013$1.22M RANGE<\/text>\n<!-- arrow down to HBU premium -->\n<line class=\"sp-fade f5\" marker-end=\"url(#varrow)\" stroke=\"#3D405B\" stroke-width=\"1.2\" x1=\"300\" x2=\"300\" y1=\"284\" y2=\"318\"><\/line>\n<!-- HBU premium added on top -->\n<rect class=\"sp-fade f5\" fill=\"#F2CC8F\" height=\"52\" stroke=\"#3D405B\" stroke-width=\"1.5\" width=\"200\" x=\"200\" y=\"322\"><\/rect>\n<text class=\"sp-fade f5\" fill=\"#3D405B\" font-family=\"JetBrains Mono, monospace\" font-size=\"9\" letter-spacing=\"2\" text-anchor=\"middle\" x=\"300\" y=\"345\">+ HBU PREMIUM<\/text>\n<text class=\"sp-fade f5\" fill=\"#3D405B\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" letter-spacing=\"1\" text-anchor=\"middle\" x=\"300\" y=\"363\">+$85K<\/text>\n<!-- arrow down to list price -->\n<line class=\"sp-fade f5\" marker-end=\"url(#varrow)\" stroke=\"#3D405B\" stroke-width=\"1.2\" x1=\"300\" x2=\"300\" y1=\"374\" y2=\"404\"><\/line>\n<!-- LIST PRICE (result) -->\n<rect class=\"sp-fade f5\" fill=\"#E07A5F\" height=\"68\" stroke=\"#3D405B\" stroke-width=\"1.5\" width=\"240\" x=\"180\" y=\"406\"><\/rect>\n<text class=\"sp-fade f5\" fill=\"#F4F1DE\" font-family=\"JetBrains Mono, monospace\" font-size=\"9\" letter-spacing=\"2\" text-anchor=\"middle\" x=\"300\" y=\"432\">LIST PRICE<\/text>\n<text class=\"sp-fade f5\" fill=\"#F4F1DE\" font-family=\"Lora, serif\" font-size=\"26\" font-style=\"italic\" text-anchor=\"middle\" x=\"300\" y=\"463\">$1.27M<\/text>\n<!-- explicit math -->\n<text class=\"sp-fade f5\" fill=\"#3D405B\" font-family=\"JetBrains Mono, monospace\" font-size=\"11\" letter-spacing=\"1.5\" text-anchor=\"middle\" x=\"300\" y=\"506\">$1.18M + $85K = $1.27M<\/text>\n<\/svg>","div":false,"script":false,"compilable":false,"iframe":false},"type":"html"},"insideRTE":false,     document.addEventListener('copy', handler);
    const ok = document.execCommand('copy');
    document.removeEventListener('copy', handler);
    const s = document.getElementById('status');
    s.textContent = ok ? '\u2713 Copied! Now paste in Webflow.' : 'Copy failed \u2013 try again.';
    s.className = ok ? 'ok' : '';
  });
</script>
</body>
</html>
