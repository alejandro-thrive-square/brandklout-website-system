<!doctype html><html><head><meta charset="utf-8"><title>Install HEAD</title>
<style>body{font:14px system-ui;margin:2rem;max-width:760px}button{font-size:1.05rem;padding:.8rem 1.4rem;background:#1463ff;color:#fff;border:0;border-radius:.4rem;cursor:pointer}.ok{color:#0a7d28;font-weight:600;margin-left:1rem}pre{background:#f5f5f7;padding:1rem;border-radius:.4rem;max-height:300px;overflow:auto;white-space:pre-wrap;font-size:12px}</style>
</head><body>
<h2>Copy HEAD code (text/plain)</h2>
<p><button id="b">Copy HEAD</button><span id="s"></span></p>
<pre id="p"></pre>
<script id="d" type="text/plain"><style>
@import url("https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
body{background:#F4F1DE;color:#3D405B;font-family:'Inter', -apple-system, sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
div.nav-toggle.w-embed{padding:0}
nav.top .right .num.num.num{color:rgba(61, 64, 91, 0.65);font-family:'JetBrains Mono', ui-monospace, Menlo, monospace}
.filing.filing.filing{position:fixed;top:50%;left:16px;transform:translateY(-50%);z-index:48;font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:0.32em;text-transform:uppercase;color:rgba(61, 64, 91, 0.42);writing-mode:vertical-rl;pointer-events:none;display:flex;gap:18px;align-items:center}
.filing.filing.filing .dot.dot.dot{width:6px;height:6px;background:#E07A5F;border-radius:50%}
.site-pane .scale-bar.scale-bar.scale-bar{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:9px;letter-spacing:0.15em;color:rgba(61, 64, 91, 0.42);z-index:4;border-top:1px solid rgba(61, 64, 91, 0.18);padding-top:8px}
.sp-draw.sp-draw.sp-draw{stroke-dasharray:1;stroke-dashoffset:1}
.site-pane.in.in.in .sp-draw.sp-draw.sp-draw{animation:spDraw 1.2s cubic-bezier(.25, .7, .2, 1) forwards}
.site-pane.in.in.in .sp-draw.sp-draw.sp-draw.d1.d1.d1{animation-delay:.1s}
.site-pane.in.in.in .sp-draw.sp-draw.sp-draw.d2.d2.d2{animation-delay:.4s}
.site-pane.in.in.in .sp-draw.sp-draw.sp-draw.d3.d3.d3{animation-delay:.7s}
.site-pane.in.in.in .sp-draw.sp-draw.sp-draw.d4.d4.d4{animation-delay:1.0s}
.site-pane.in.in.in .sp-fade{opacity:1}
.site-pane.in.in.in .sp-fade.f2{transition-delay:.6s}
.site-pane.in.in.in .sp-fade.f3{transition-delay:1.0s}
.site-pane.in.in.in .sp-fade.f4{transition-delay:1.4s}
.site-pane.in.in.in .sp-fade.f5{transition-delay:1.8s}
.foot-bar>*:nth-child(3){text-align:right}
.reveal.in.in.in{opacity:1;transform:none}
.reveal-stagger.in.in.in>*{opacity:1;transform:none}
.reveal-stagger.in.in.in>*:nth-child(1){transition-delay:.04s}
.reveal-stagger.in.in.in>*:nth-child(2){transition-delay:.12s}
.reveal-stagger.in.in.in>*:nth-child(3){transition-delay:.20s}
.reveal-stagger.in.in.in>*:nth-child(4){transition-delay:.28s}
.reveal-stagger.in.in.in>*:nth-child(5){transition-delay:.36s}
.reveal-stagger.in.in.in>*:nth-child(6){transition-delay:.44s}
@media (max-width: 991px){
nav.top .links.open.open.open{display:flex;flex-direction:column;gap:0;position:fixed;top:60px;left:0;right:0;background:#F4F1DE;z-index:48;border-bottom:2px solid #E07A5F;box-shadow:0 8px 24px rgba(61, 64, 91, 0.12)}
nav.top .links.open.open.open a{display:block;padding:14px 24px;border-bottom:1px solid rgba(61, 64, 91, 0.14);font-size:13px}
nav.top .links.open.open.open a > .a-after{display:none}
nav.top .right .num.num.num{display:none}
.filing.filing.filing{display:none}
}
@media (max-width: 767px){
nav.top .links.open.open.open{top:54px}
.foot-bar>*:nth-child(3){text-align:left}
}
@keyframes scrollHint{

      0%,
      100% {
        transform: translateX(0);
        opacity: 1;
      }

      50% {
        transform: translateX(8px);
        opacity: .4;
      }
    }
@keyframes spDraw{
      to {
        stroke-dashoffset: 0;
      }
    }

/* --- Mobile QA fixes (client round 2, 2026-07-07) ---
   Mirrored from SITE-LEVEL head custom code (Webflow Site Settings > Custom Code),
   where the live copy is maintained. Kept here so a future per-page reinstall or
   site-code reset does not regress the fixes. */
@media (max-width: 991px){
/* open mobile menu sat at top:54/60px but the built nav is 67/75px tall - it overlapped the navbar */
nav.top .links.open.open.open.open{top:75px}
/* the active nav link's desktop underline (.active-after) painted a stray full-width coral line in the open menu */
nav.top .links.open.open.open.open a > .active-after{display:none}
}
@media (max-width: 767px){
nav.top .links.open.open.open.open{top:67px}
/* services rail: restore the source design's 80vw phone card (conversion kept the 320px desktop clamp, pushing the card right on narrow phones) */
.h-stage .track .svc.svc.svc{flex:0 0 80vw;max-width:80vw}
}
@media (max-width: 479px){
/* "Direct line" rows: stack label above value on phones (covers .reach + per-page suffixed variants) */
[class^="reach"] > a{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
[class^="reach"] > a .k{grid-column:1 / -1}
}
</style>
</script>
<script>
const t=document.getElementById('d').textContent;
document.getElementById('p').textContent=t;
document.getElementById('b').addEventListener('click',()=>{
  const h=ev=>{ev.preventDefault();ev.clipboardData.setData('text/plain',t);};
  document.addEventListener('copy',h);
  const ok=document.execCommand('copy');
  document.removeEventListener('copy',h);
  const s=document.getElementById('s');
  s.textContent= ok ? '✓ Copied '+t.length+' chars' : 'Copy failed';
  s.className= ok ? 'ok':'';
});
</script></body></html>
