<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Copy HEAD CSS (style)</title></head>
<body style="font:15px/1.5 system-ui,sans-serif;max-width:680px;margin:3rem auto;padding:0 1rem">
<h1>Copy HEAD CSS (style)</h1>
<p>Click, then focus the Webflow code field and press Ctrl/Cmd+V.</p>
<button id="btn" style="font-size:1.1rem;padding:.9rem 1.6rem;border:0;border-radius:.5rem;background:#1463ff;color:#fff;cursor:pointer">Copy to clipboard</button>
<span id="status" style="margin-left:1rem;font-weight:600"></span>
<textarea id="payload" style="position:absolute;left:-9999px;top:-9999px">&lt;style&gt;
@import url(&quot;https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap&quot;);
body{background:#F4F1DE;color:#3D405B;font-family:&#x27;Inter&#x27;, -apple-system, sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
nav.top .right .num.num.num{color:rgba(61, 64, 91, 0.65);font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace}
.filing.filing.filing{position:fixed;top:50%;left:16px;transform:translateY(-50%);z-index:48;font-family:&#x27;JetBrains Mono&#x27;, ui-monospace, Menlo, monospace;font-size:10px;letter-spacing:0.32em;text-transform:uppercase;color:rgba(61, 64, 91, 0.42);writing-mode:vertical-rl;pointer-events:none;display:flex;gap:18px;align-items:center}
.filing.filing.filing .dot.dot.dot{width:6px;height:6px;background:#3D405B;border-radius:50%}
.dcf-pane.in.in.in .bar-grow{animation:growY .9s cubic-bezier(.2, .7, .2, 1) forwards}
.dcf-pane.in.in.in .bar-grow:nth-child(1){animation-delay:.1s}
.dcf-pane.in.in.in .bar-grow:nth-child(2){animation-delay:.2s}
.dcf-pane.in.in.in .bar-grow:nth-child(3){animation-delay:.3s}
.dcf-pane.in.in.in .bar-grow:nth-child(4){animation-delay:.4s}
.dcf-pane.in.in.in .bar-grow:nth-child(5){animation-delay:.5s}
.dcf-pane.in.in.in .bar-grow:nth-child(6){animation-delay:.6s}
.dcf-pane.in.in.in .bar-grow:nth-child(7){animation-delay:.7s}
.dcf-pane.in.in.in .bar-grow:nth-child(8){animation-delay:.8s}
.dcf-pane.in.in.in .bar-grow:nth-child(9){animation-delay:.9s}
.dcf-pane.in.in.in .bar-grow:nth-child(10){animation-delay:1.0s}
.dcf-pane.in.in.in .exit-bar{animation:growY 1s cubic-bezier(.2, .7, .2, 1) 1.1s forwards;transform:scaleY(0);transform-origin:bottom}
.dcf-pane.in.in.in .fade-in-d{opacity:1;transition-delay:1.4s}
.dcf-pane.in.in.in .fade-in-d.d2{transition-delay:1.7s}
.pin-step.pin-step.pin-step.active.active.active{opacity:1}
.pin-step.active.active.active .n{color:#E07A5F}
.pin-step.active.active.active h3{color:#F2CC8F}
.stage-row.shown.shown.shown{opacity:1;transform:none}
.stage-row.shown.shown.shown .tag{border-color:#E07A5F;color:#F4F1DE}
.six-grid.in.in.in .item .id &gt; .id-after{transform:scaleX(1)}
.six-grid.in.in.in .item:nth-child(2) .id &gt; .id-after{transition-delay:.08s}
.six-grid.in.in.in .item:nth-child(3) .id &gt; .id-after{transition-delay:.16s}
.six-grid.in.in.in .item:nth-child(4) .id &gt; .id-after{transition-delay:.24s}
.six-grid.in.in.in .item:nth-child(5) .id &gt; .id-after{transition-delay:.32s}
.six-grid.in.in.in .item:nth-child(6) .id &gt; .id-after{transition-delay:.40s}
.foot-bar-scale&gt;*:nth-child(3){text-align:right}
.reveal.in.in.in{opacity:1;transform:none}
.reveal-stagger.in.in.in&gt;*{opacity:1;transform:none}
.reveal-stagger.in.in.in&gt;*:nth-child(1){transition-delay:.04s}
.reveal-stagger.in.in.in&gt;*:nth-child(2){transition-delay:.12s}
.reveal-stagger.in.in.in&gt;*:nth-child(3){transition-delay:.20s}
.reveal-stagger.in.in.in&gt;*:nth-child(4){transition-delay:.28s}
.reveal-stagger.in.in.in&gt;*:nth-child(5){transition-delay:.36s}
.reveal-stagger.in.in.in&gt;*:nth-child(6){transition-delay:.44s}
@media (max-width: 991px){
nav.top .links.open.open.open{display:flex;flex-direction:column;gap:0;position:fixed;top:60px;left:0;right:0;background:#F4F1DE;z-index:48;border-bottom:2px solid #E07A5F;box-shadow:0 8px 24px rgba(61, 64, 91, 0.12)}
nav.top .links.open.open.open a{display:block;padding:14px 24px;border-bottom:1px solid rgba(61, 64, 91, 0.14);font-size:13px}
nav.top .links.open.open.open a &gt; .a-after{display:none}
nav.top .right .num.num.num{display:none}
.filing.filing.filing{display:none}
}
@media (max-width: 767px){
nav.top .links.open.open.open{top:54px}
.foot-bar-scale&gt;*:nth-child(3){text-align:left}
}
@keyframes scrollHint{

      0%,
      100% {
        transform: translateX(0);
        opacity: 1;
      }

      50% {
        transform: translateX(8px);
        opacity: .4;
      }
    }
@keyframes growY{
      to {
        transform: scaleY(1);
      }
    }

&lt;/style&gt;</textarea>
<script>
const txt=document.getElementById('payload').value;
document.getElementById('btn').addEventListener('click',()=>{
  const h=(e)=>{e.preventDefault();e.clipboardData.setData('text/plain',txt);};
  document.addEventListener('copy',h);
  const ok=document.execCommand('copy');
  document.removeEventListener('copy',h);
  const s=document.getElementById('status');
  s.textContent=ok?('\u2713 Copied '+txt.length+' chars'):'copy failed';
});
</script>
</body></html>
