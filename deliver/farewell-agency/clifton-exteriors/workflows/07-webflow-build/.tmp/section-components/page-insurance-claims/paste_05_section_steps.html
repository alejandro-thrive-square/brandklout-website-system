81ed-f18dd06f125d"],"children":["d576871e-853f-464b-b24a-2e847e00915b"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}}}},{"_id":"d576871e-853f-464b-b24a-2e847e00915b","text":true,"v":"Once you have determined that you would like Clifton Exteriors to be your contractor of choice and represent you through the claims process, we will meet your adjuster during the home inspection and point out any damages observed during the initial contractor inspection. Please note that your insurance company will ultimately decide if there was a sufficient loss, but we can be a second pair of eyes for them during this process. We have been on many inspections after the adjuster inspected the home without us present and initially deemed it a non-sufficient loss. Then, we produced pictures and evidence to the insurance company proving a sufficient loss. So, it's essential to have a contractor present during this process."},{"_id":"655eb82e-f855-4206-aff8-3492668dc23a","type":"Block","tag":"div","classes":["25bc0b2e-3037-4e0b-a211-05885f10635b"],"children":["3a905f01-b2de-4274-91d4-75d6aa90ad36","3e206ba8-e432-443f-84f0-33973b0524fa","37cc8325-da8f-41b8-af97-8bf7606130e7"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[{"name":"data-nx-step","value":""}],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}},{"_id":"3a905f01-b2de-4274-91d4-75d6aa90ad36","type":"Block","tag":"div","classes":["81ca47c7-9176-418b-b0f5-6c2c662ffb8f"],"children":[],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[{"name":"aria-hidden","value":"true"}],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}},{"_id":"3e206ba8-e432-443f-84f0-33973b0524fa", he business of making money and may not always have your best interest at heart. It's very common for insurance companies to leave out critical costs that would allow your project to be completed per state code safety & compliance, as well as other items you are entitled to for a properly installed project. We examine the \"Statement of Loss\" for any missed items in the report and inform your insurance company of any discrepancies."},{"_id":"d49186da-9e03-4858-8fb7-2b55e0463ffb","type":"Block","tag":"div","classes":["25bc0b2e-3037-4e0b-a211-05885f10635b"],"children":["37c911de-f1b2-40f4-a721-48d1f4a25865","6c157354-e712-4dc7-b6b2-0fffc22f1527","33477a78-87d2-44fe-9057-76f22adf2057"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[{"name":"data-nx-step","value":""}],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}},{"_id":"37c911de-f1b2-40f4-a721-48d1f4a25865","type":"Block","tag":"div","classes":["81ca47c7-9176-418b-b0f5-6c2c662ffb8f"],"children":[],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[{"name":"aria-hidden","value":"true"}],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":false,"tag":"div"}},{"_id":"6c157354-e712-4dc7-b6b2-0fffc22f1527","type":"Block","tag":"div","classes":["30c132c9-1b57-4c1d-9367-ec34879355eb"],"children":["4b8f52cb-b645-40a7-8100-291e9defcdb6"],"data":{"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}},"text":true,"tag":"div"}},{"_id":"4b8f52cb-b645-40a7-8100-291e9defcdb6","text":true,"v":"05"},{"_id":"33477a78-87d2-44fe-9057-76f22adf2057","type":"Block","tag":"div","classes":["1a23cc34-c69a-4b7e-a301-0862941e5ebd"],"children":["223651bb-8024-41c8-87f9-67f377700cbb","42df45be-2d97-41b8-858b-f4c39f9 <script>
  const json = document.getElementById('payload').textContent;
  document.getElementById('btn').addEventListener('click', () => {
    const handler = (e) => {
      e.preventDefault();
      e.clipboardData.setData('application/json', json);
      e.clipboardData.setData('text/plain', json);
    };
    document.addEventListener('copy', handler);
    const ok = document.execCommand('copy');
    document.removeEventListener('copy', handler);
    const s = document.getElementById('status');
    s.textContent = ok ? '\u2713 Copied! Now paste in Webflow.' : 'Copy failed \u2013 try again.';
    s.className = ok ? 'ok' : '';
  });
</script>
