<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clifton Exteriors — CTA section (new)</title>
<!-- Preview scaffold: body font/background only. Converter ignores <link>. -->
<link rel="stylesheet" href="_preview-base.css">

<!-- ==============================================================
     STATIC SECTION CSS — BAKE SOURCE (see section-reviews.html for
     the packaging model). Bespoke classes only; the cx-btn block is
     byte-identical to the one in section-reviews.html so the defs
     merge on paste.
     ============================================================== -->
<style>
:root {
  --_primitives---neutral-colors--brand-colors--blue: #243864;
  --_primitives---neutral-colors--brand-colors--red: #b02034;
  --_primitives---neutral-colors--neutral-dark: #121c32;
  --_primitives---neutral-colors--neutral-darkest: #060911;
  --_primitives---neutral-colors--neutral-light: #f6f4ef;
  --_primitives---neutral-colors--neutral-lightest: #faf9f7;
  --_primitives---neutral-colors--neutral: #d6d6d6;
}

/* section root — dark-band recipe (navy panel, 1rem radius) on u-section metrics */
.section_cta-quote {
  width: 100%;
  max-width: 80rem;
  margin: 2rem auto;
  padding: 8rem 5%;
  position: relative;
  overflow: hidden;
  background-color: var(--_primitives---neutral-colors--neutral-dark);
  border-radius: 1rem;
}

.cta-quote__bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
.cta-quote__glow {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  background-image:
    radial-gradient(60% 80% at 20% 0%, #eae1d51f, transparent 60%),
    radial-gradient(50% 70% at 85% 100%, #24386480, transparent 65%);
}
.cta-quote__scrim {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  background-image: linear-gradient(180deg, #3d403c33, transparent 45%, var(--_primitives---neutral-colors--neutral-darkest));
  opacity: 0.8;
}

.cta-quote__content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.5rem;
  max-width: 48rem;
  margin-left: auto;
  margin-right: auto;
}
.cta-quote__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  -webkit-backdrop-filter: blur(50px);
  backdrop-filter: blur(50px);
  background-color: #dadada33;
  border-radius: 24px;
  padding: 6px 14px 6px 10px;
  font-size: 0.95rem;
  color: var(--_primitives---neutral-colors--neutral-lightest);
}
.cta-quote__badge-star {
  display: flex;
  align-items: center;
  color: var(--_primitives---neutral-colors--neutral-lightest);
}
.cta-quote__h {
  margin: 0;
  font-family: 'Hanken Grotesk', Arial, sans-serif;
  font-size: 4rem;
  line-height: 1;
  letter-spacing: -0.01em;
  font-weight: 400;
  color: var(--_primitives---neutral-colors--neutral-lightest);
}
.cta-quote__em {
  font-family: 'Erode Variable', 'Erode', Georgia, serif;
  font-style: italic;
  font-weight: 400;
}
.cta-quote__sub {
  max-width: 36rem;
  color: var(--_primitives---neutral-colors--neutral-lightest);
  opacity: 0.85;
  font-size: 1.125rem;
  line-height: 1.5;
}
.cta-quote__p { margin: 0; }
.cta-quote__buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-top: 0.5rem;
}

/* cx-btn — bespoke clone of the build's button component (identical block in
   section-reviews.html; keep both copies byte-identical so defs merge). */
.cx-btn {
  border-radius: 2rem;
  background-color: var(--_primitives---neutral-colors--brand-colors--blue);
  color: var(--_primitives---neutral-colors--neutral-lightest);
  text-align: center;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  padding: 0.625rem 1.5rem;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  text-decoration: none;
  display: flex;
  overflow: hidden;
}
.cx-btn__hide { height: 1.5rem; overflow: hidden; }
.cx-btn__wrap { display: flex; flex-direction: column; }
.cx-btn__tile {
  grid-column-gap: 8px;
  grid-row-gap: 8px;
  justify-content: flex-start;
  align-items: center;
  display: flex;
}
.cx-btn__arrow { justify-content: center; align-items: center; display: flex; }

/* glass variant on the dark band */
.cx-btn.is--glass {
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  background-color: #faf9f733;
  color: var(--_primitives---neutral-colors--neutral-lightest);
}

@media screen and (max-width: 991px) {
  .cta-quote__h { font-size: 3.25rem; }
}
@media screen and (max-width: 767px) {
  .section_cta-quote { padding-top: 5rem; padding-bottom: 5rem; }
  .cta-quote__h { font-size: 2.75rem; }
}
@media screen and (max-width: 479px) {
  .cta-quote__h { font-size: 2.25rem; }
  .cta-quote__buttons { flex-direction: column; width: 100%; }
  .cta-quote__buttons .cx-btn { width: 100%; }
  .cx-btn__hide { height: auto; }
  .cx-btn__wrap { height: 20px; }
  .cx-btn__tile.is--bottom { display: none; }
  .cx-btn__arrow { display: none; }
}
</style>
</head>
<body>

<!-- ================================================================
     SECTION: Final CTA band — pasteable component (root: section_cta-quote)
     Content 1:1 from cliftonexteriors.com final CTA band
     ("Add To The Curb Appeal Of Your Home" + Get A Quote) enriched
     with the old site's price-match guarantee. Goes between the
     reviews section and the footer. No hotlinked WP video — depth
     via the build's gradient-scrim language.
     ================================================================ -->
<section class="section_cta-quote" data-cta-quote>

  <div class="cta-quote__bg" aria-hidden="true">
    <div class="cta-quote__glow"></div>
    <div class="cta-quote__scrim"></div>
  </div>

  <div class="cta-quote__content">
    <div class="cta-quote__badge" data-cta-reveal>
      <span class="cta-quote__badge-star" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>
      </span>
      <span>5/5 from over 75 reviews</span>
    </div>

    <div class="cta-quote__heading" data-cta-reveal>
      <h2 class="cta-quote__h">Add To The <em class="cta-quote__em">Curb Appeal</em> Of Your Home</h2>
    </div>

    <div class="cta-quote__sub" data-cta-reveal>
      <p class="cta-quote__p">Quality windows, roofing, siding, doors &amp; gutters at a fair price. Found a better quote? We&rsquo;ll match it &mdash; or go lower. Guaranteed.</p>
    </div>

    <div class="cta-quote__buttons" data-cta-reveal>
      <a href="/contact-us" class="cx-btn">
        <div class="cx-btn__hide">
          <div class="cx-btn__wrap">
            <div class="cx-btn__tile">
              <div>Get A Quote</div>
              <div class="cx-btn__arrow"><svg width="7" height="10" viewBox="0 0 7 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 9L5 5L1 1" stroke="currentColor" stroke-width="2"/></svg></div>
            </div>
            <div class="cx-btn__tile is--bottom">
              <div>Get A Quote</div>
              <div class="cx-btn__arrow"><svg width="7" height="10" viewBox="0 0 7 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 9L5 5L1 1" stroke="currentColor" stroke-width="2"/></svg></div>
            </div>
          </div>
        </div>
      </a>
      <a href="tel:+15712491480" class="cx-btn is--glass">
        <div class="cx-btn__hide">
          <div class="cx-btn__wrap">
            <div class="cx-btn__tile">
              <div>Call (571) 249-1480</div>
            </div>
            <div class="cx-btn__tile is--bottom">
              <div>Call (571) 249-1480</div>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- EMBED 1 of 2: runtime CSS (rides as HtmlEmbed) -->
  <style data-embed>
    /* reveal states — applied by JS only, so content is never CSS-hidden */
    .cta-quote__pre { opacity: 0; transform: translateY(1.5rem); }
    .cta-quote__pre.cta-quote__in {
      opacity: 1;
      transform: none;
      transition: opacity .7s ease, transform .7s cubic-bezier(.22, 1, .36, 1);
    }
    .section_cta-quote .cx-btn__wrap { transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
    .section_cta-quote .cx-btn:hover .cx-btn__wrap { transform: translateY(-50%); }
  </style>

  <!-- EMBED 2 of 2: section JS (rides as HtmlEmbed) -->
  <script data-embed>
    /* section_cta-quote — staggered reveal on first view (dependency-free) */
    (function () {
      function initCta(section) {
        if (!section || section.getAttribute('data-cta-ready')) return;
        section.setAttribute('data-cta-ready', '1');

        if (!('IntersectionObserver' in window)) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var items = section.querySelectorAll('[data-cta-reveal]');
        items.forEach(function (el) { el.classList.add('cta-quote__pre'); });

        var io = new IntersectionObserver(function (entries) {
          if (!entries[0].isIntersecting) return;
          io.disconnect();
          items.forEach(function (el, i) {
            setTimeout(function () { el.classList.add('cta-quote__in'); }, i * 110);
          });
        }, { threshold: .35 });
        io.observe(section);
      }

      function boot() {
        document.querySelectorAll('[data-cta-quote]').forEach(initCta);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>

</section>
<!-- ================== end pasteable component ================== -->

</body>
</html>
