<script>
(function () {
  var script = document.currentScript;
  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once: true });
    } else {
      fn();
    }
  }
  function markOnce(el, key) {
    if (!el || el.getAttribute(key) === 'true') { return false; }
    el.setAttribute(key, 'true');
    return true;
  }
  function findSection() {
    if (!script) { return document.querySelector('.section_projects:not([data-hz-projects-section-ready])'); }
    if (script.closest('.section_projects')) { return script.closest('.section_projects'); }

    var node = script.previousElementSibling;
    while (node) {
      if (node.matches && node.matches('.section_projects')) { return node; }
      if (node.querySelector) {
        var nested = node.querySelector('.section_projects');
        if (nested) { return nested; }
      }
      node = node.previousElementSibling;
    }

    var parent = script.parentElement;
    while (parent && parent !== document.body) {
      var local = parent.querySelector && parent.querySelector('.section_projects:not([data-hz-projects-section-ready])');
      if (local) { return local; }
      parent = parent.parentElement;
    }

    var sections = document.querySelectorAll('.section_projects:not([data-hz-projects-section-ready])');
    return sections.length === 1 ? sections[0] : null;
  }
  function initMotion(scope, hasGsap, hasST, hasSplit) {
    if (hasST) {
      scope.querySelectorAll('[data-hz-reveal]').forEach(function (el) {
        if (!markOnce(el, 'data-hz-reveal-ready')) { return; }
        gsap.from(el, {
          y: 48, opacity: 0, duration: 1, ease: 'power3.out',
          scrollTrigger: { trigger: el, start: 'top 88%', once: true }
        });
      });
    }
    if (hasST && hasSplit) {
      scope.querySelectorAll('[data-hz-split]').forEach(function (el) {
        if (!markOnce(el, 'data-hz-split-ready')) { return; }
        var split = new SplitText(el, { type: 'lines', linesClass: 'hz-line' });
        gsap.from(split.lines, {
          yPercent: 110, opacity: 0, stagger: 0.09, duration: 1.1, ease: 'power4.out',
          scrollTrigger: { trigger: el, start: 'top 85%', once: true }
        });
      });
    }
  }
  function ensurePreviewData(list) {
    list.querySelectorAll('.projects_row').forEach(function (row, i) {
      row.setAttribute('data-hz-preview', String(i + 1));
    });
  }
  function ensurePreviewBox(section, list) {
    var box = section.querySelector('[data-hz-preview-box]');
    if (box) { return box; }

    box = document.createElement('div');
    box.className = 'projects_preview';
    box.setAttribute('data-hz-preview-box', '');
    box.style.opacity = '0';
    box.style.pointerEvents = 'none';

    list.querySelectorAll('.projects_row').forEach(function (row, i) {
      var thumb = row.querySelector('.projects_thumb');
      if (!thumb || !thumb.getAttribute('src')) { return; }
      var img = document.createElement('img');
      img.className = 'projects_preview-img';
      img.setAttribute('data-hz-preview-img', String(i + 1));
      img.setAttribute('src', thumb.currentSrc || thumb.getAttribute('src'));
      img.setAttribute('alt', '');
      img.style.opacity = '0';
      img.style.transform = 'scale(1.08)';
      box.appendChild(img);
    });

    list.appendChild(box);
    return box.children.length ? box : null;
  }
  ready(function () {
    var section = findSection();
    if (!section) {
      console.warn('[Horizon Projects] No .section_projects wrapper found for this script embed.');
      return;
    }
    if (!markOnce(section, 'data-hz-projects-section-ready')) { return; }

    var hasGsap = typeof window.gsap !== 'undefined';
    var hasST = hasGsap && typeof window.ScrollTrigger !== 'undefined';
    var hasSplit = hasGsap && typeof window.SplitText !== 'undefined';
    if (!hasGsap) {
      console.warn('[Horizon Projects] GSAP is not loaded. Scroll reveals will not run; hover preview will use a basic fallback.');
    }
    if (hasST) { gsap.registerPlugin(ScrollTrigger); }
    initMotion(section, hasGsap, hasST, hasSplit);

    var list = section.querySelector('[data-hz-projects]') || section.querySelector('.projects_list');
    if (list) { ensurePreviewData(list); }
    var box = list ? ensurePreviewBox(section, list) : null;
    var desktopHover = window.matchMedia('(hover: hover) and (min-width: 992px)');
    if (!list || !box) {
      console.warn('[Horizon Projects] Missing .projects_list or preview images inside .section_projects.');
      return;
    }
    if (!desktopHover.matches) { return; }

    box.style.willChange = 'transform, opacity';
    var xTo = hasGsap ? gsap.quickTo(box, 'x', { duration: 0.45, ease: 'power3.out' }) : null;
    var yTo = hasGsap ? gsap.quickTo(box, 'y', { duration: 0.45, ease: 'power3.out' }) : null;
    list.addEventListener('mousemove', function (e) {
      var r = list.getBoundingClientRect();
      var x = e.clientX - r.left - 160;
      var y = e.clientY - r.top - 110;
      if (hasGsap) {
        xTo(x);
        yTo(y);
      } else {
        box.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
      }
    });
    list.querySelectorAll('[data-hz-preview]').forEach(function (row) {
      row.addEventListener('mouseenter', function () {
        var n = row.getAttribute('data-hz-preview');
        box.style.opacity = '1';
        box.querySelectorAll('[data-hz-preview-img]').forEach(function (img) {
          var on = img.getAttribute('data-hz-preview-img') === n;
          img.style.opacity = on ? '1' : '0';
          img.style.transform = on ? 'scale(1)' : 'scale(1.08)';
        });
      });
    });
    list.addEventListener('mouseleave', function () { box.style.opacity = '0'; });
    if (hasST) { ScrollTrigger.refresh(); }
  });
})();
</script>
