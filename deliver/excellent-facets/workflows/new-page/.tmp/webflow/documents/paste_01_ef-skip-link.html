<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paste into Webflow</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;color:#111}
  button{font-size:1.1rem;padding:.9rem 1.6rem;border:0;border-radius:.5rem;
          background:#1463ff;color:#fff;cursor:pointer}
  button:active{transform:translateY(1px)}
  .ok{color:#0a7d28;font-weight:600}
  code{background:#f0f0f3;padding:.1rem .3rem;border-radius:.25rem}
  small{color:#666}
</style>
</head>
<body>
<h1>Copy component for Webflow</h1>
<p>Click the button, then switch to the Webflow Designer, click on the canvas,
and press <code>Ctrl/Cmd&nbsp;+&nbsp;V</code>.</p>
<p><button id="btn">Copy to Webflow clipboard</button>
   <span id="status"></span></p>
<p><small>Writes the payload under the <code>application/json</code> MIME type
   Webflow's paste handler reads.</small></p>
<script type="application/json" id="payload">{"type":"@webflow/XscpData","payload":{"nodes":[{"_id":"c52a1f34-d2a7-4308-84be-651b019d91c3","type":"Link","tag":"a","classes":["89c19d62-7e78-41bb-aae4-3e4432366e17"],"children":["9f5d999f-c83c-4895-8c1a-55cdfa7418f8"],"data":{"button":false,"block":"","link":{"mode":"external","url":"#documents-library"},"eventIds":[],"devlink":{"runtimeProps":{},"slot":""},"displayName":"","attr":{"id":""},"xattr":[],"search":{"exclude":false},"visibility":{"conditions":[],"keepInHtml":{"tag":"False","val":{}}}}},{"_id":"9f5d999f-c83c-4895-8c1a-55cdfa7418f8","text":true,"v":"Skip to documents / Aller aux documents"}],"styles":[{"_id":"89c19d62-7e78-41bb-aae4-3e4432366e17","fake":false,"type":"class","name":"ef-skip-link","namespace":"","comb":"","styleLess":"box-sizing: border-box; min-width: 20rem; margin-top: 0; margin-right: 0; margin-bottom: 0; margin-left: 0; background: #ffffff; color: #202020; font-family: \"Kantumruy Pro\", Arial, sans-serif; font-size: 1rem; font-weight: 400; line-height: 1.5; -webkit-font-smoothing: antialiased; font: inherit; position: fixed; top: 0.75rem; left: 0.75rem; z-index: 1000; padding-top: 0.75rem; padding-right: 1rem; padding-bottom: 0.75rem; padding-left: 1rem; border-top-left-radius: 0rem; border-top-right-radius: 0rem; border-bottom-right-radius: 0rem; border-bottom-left-radius: 0rem; transform: translateY(-160%);","variants":{},"children":[],"origin":null,"selector":null}],"assets":[],"ix1":[],"ix2":{"interactions":[],"events":[],"actionLists":[]}},"meta":{"droppedLinks":0,"dynBindRemovedCount":0,"dynListBindRemovedCount":0,"paginationRemovedCount":0,"universalBindingsRemovedCount":0,"unlinkedSymbolCount":0,"codeComponentsRemovedCount":0,"richTextComponentsStripped":false}}</script>
<script>
  const json = document.getElementById('payload').textContent;
  document.getElementById('btn').addEventListener('click', () => {
    const handler = (e) => {
      e.preventDefault();
      e.clipboardData.setData('application/json', json);
      e.clipboardData.setData('text/plain', json);
    };
    document.addEventListener('copy', handler);
    const ok = document.execCommand('copy');
    document.removeEventListener('copy', handler);
    const s = document.getElementById('status');
    s.textContent = ok ? '\u2713 Copied! Now paste in Webflow.' : 'Copy failed \u2013 try again.';
    s.className = ok ? 'ok' : '';
  });
</script>
</body>
</html>
