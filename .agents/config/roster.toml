# Webzite Agent Dispatch — roster & provider config
#
# Two axes:
#   ROLE  -> which agent (the specialist / task type).  e.g. review, design, docs
#   TIER  -> which provider + model (the power).        lite | standard | heavy | max
#
# An agent declares its natural `tier`; the [capability] table turns
# (tier, provider) into a concrete model. So model ids live in ONE place —
# when new models ship, edit [capability] only.
#
# Run `python .agents/dispatch.py routes` to see the resolved result.

[settings]
timeout_sec = 900        # default per-call timeout
max_depth   = 3          # recursion guard: agent -> agent -> agent chain depth

# Autonomous-loop ceilings & defaults (the `loop` subcommand). These are the hard
# safety bounds a loop can never exceed — --max-iter / --budget-sec clamp to them.
[settings.loop]
max_iter_ceiling   = 10      # --max-iter can never exceed this
budget_sec_ceiling = 10800   # 3h absolute wall-clock cap across all iterations
default_max_iter   = 6       # when neither --max-iter nor a recipe sets one
default_pass_score = 90      # verifier score >= this counts as approved
stall_limit        = 2       # identical workspace fingerprint N rounds -> stalled
error_tolerance    = 1       # producer/verifier errors tolerated before status=error
notify_each        = false   # true = a toast per iteration (debug); default: only on terminal

# Permission-bypass (autonomy) layer. A loop has NO human between rounds, so its
# cold producer/verifier CLIs must run in each provider's bypass mode (see each
# provider's `bypass_args`) or they stall on the first tool-approval prompt and
# never touch the workspace. This is dangerous (the agent acts with no approval),
# so it is fenced by a STRUCTURAL gate, not just a toggle: bypass ENGAGES only when
# --cwd is a real directory strictly inside an allowlisted root (never the repo
# root itself, never an unset or out-of-tree --cwd). If the gate is not met the
# loop still runs, just permission-GATED (safe default) — it withholds the
# dangerous capability rather than granting an unsafe one. Per-run: --no-bypass.
bypass       = true          # default-on for loops (still subject to the gate below)
bypass_roots = []            # extra ABSOLUTE dirs where bypass may operate; the repo
                             # root is ALWAYS included; [] = repo subfolders only

[notifications]
enabled = true           # show a desktop toast when an agent finishes (ask / worker)
sound   = true           # play a sound with the notification
# Per-task silence: pass --no-notify to `ask` / `handoff`

# ----------------------------------------------------------------- providers
# Each provider's `command` MUST contain exactly one {prompt} token (the prompt
# is passed as a single argv element, so multiline prompts are safe).
# `model_args` (optional) are appended only when a model is resolved.
# `env` (optional) is merged into the child env (~ is expanded).
# `bypass_args` (optional) are appended ONLY for autonomous `loop` runs and ONLY
#   when the structural safety gate passes (a bounded --cwd under an allowlisted
#   root — see [settings.loop] and DISPATCH.md). They put the provider's CLI into
#   permission-bypass mode so a headless producer can actually edit the workspace
#   without stalling on a tool-approval prompt (there is no human between rounds).
#   A provider with no `bypass_args` can't run a loop autonomously — it falls back
#   to the safe permission-gated mode (and will likely stall).

# prompt_stdin = true  -> the prompt is piped to the CLI via STDIN, not the command
#   line. REQUIRED on Windows for any multi-line prompt: npm CLIs are .cmd/.bat
#   shims run through cmd.exe, which truncates a newline-bearing argv element at the
#   first line. Providers WITHOUT prompt_stdin keep {prompt} as an argument and are
#   safe only for single-line prompts (see the TODOs on pi/opencode/gemini).

[providers.claude]
command    = ["claude", "-p", "--output-format", "text"]   # prompt via stdin
prompt_stdin = true
model_args = ["--model", "{model}"]
bypass_args = ["--dangerously-skip-permissions"]   # bypass all permission checks (loop autonomy)
# team account: default config dir (~/.claude)

[providers.claude2]
command    = ["claude", "-p", "--output-format", "text"]   # prompt via stdin
prompt_stdin = true
model_args = ["--model", "{model}"]
bypass_args = ["--dangerously-skip-permissions"]
env        = { CLAUDE_CONFIG_DIR = "~/.claude-account-b" }   # personal (Max) account

[providers.codex]
# `-` tells `codex exec` to read the prompt from stdin (see `codex exec --help`).
command    = ["codex", "exec", "--skip-git-repo-check", "-"]
prompt_stdin = true
model_args = ["-m", "{model}"]
# Bypass keeps Codex's OS-level workspace-write JAIL (a real sandbox confined to
# --cwd) while removing the approval prompt — the safest possible bypass.
bypass_args = ["-c", "approval_policy=never", "--sandbox", "workspace-write"]

[providers.pi]
command    = ["pi", "-p", "{prompt}"]
model_args = ["--model", "{model}"]
bypass_args = ["--approve"]   # UNVERIFIED guess — TODO: confirm pi's real bypass flag before trusting autonomous pi loops
# Models MUST be fully qualified as provider/id. A bare "glm-5.2" resolves to
# the opencode gateway (which pi is not logged into) and hard-fails.

[providers.opencode]
command    = ["opencode", "run", "{prompt}"]
model_args = ["-m", "{model}"]
bypass_args = ["--auto"]   # UNVERIFIED guess — TODO: confirm opencode's real bypass flag before trusting autonomous opencode loops
# Models are "<provider>/<id>" (see `opencode models`). TWO provider families:
#   zai-coding-plan/*  -> the Z.ai coding plan. WORKS (subscription).
#   opencode/*         -> the opencode "zen" gateway. BLOCKED: the workspace has
#                         no payment method, so every call fails with
#                         "No payment method". This is the only route to
#                         deepseek-v4-* / the gateway's Claude+GPT mirrors.
#                         Add billing at opencode.ai to unlock it.
# Only zai-coding-plan models are routed. Keep it that way until billing exists.

[providers.gemini]
command    = ["gemini", "{prompt}"]
bypass_args = ["--yolo"]   # UNVERIFIED guess — TODO: confirm gemini's real bypass flag before trusting autonomous gemini loops
# Experimental; not routed to any role by default.

# ----------------------------------------------------------------- agents
# Routed by ROLE. Each agent declares a `tier`, not a model — the model comes
# from [capability] below. `--diff N` overrides the agent's tier for one call.
#
# Two named Claude agents (claude / claude2) run the same binary under separate
# config dirs, so two concurrent jobs can run on different accounts.

# --- max tier (Fable): judgment, critique, strategy -------------------------
[agents.claude-review]
provider = "claude"
tier     = "max"
roles    = ["review", "code-review", "audit", "bugs"]
note     = "Fable - review code, spot bugs and errors"

[agents.claude-plan]
provider = "claude"
tier     = "max"
roles    = ["plan", "strategy", "system-improvement"]
note     = "Fable - planning + strategy (internal and client)"

[agents.claude-design-qa]
provider = "claude"
tier     = "max"
roles    = ["design-qa", "design-review", "ux-review"]
note     = "Fable - review sites, fix desktop/mobile design errors"

# --- heavy tier (Opus / Codex Sol): generative production -------------------
[agents.claude-design]
provider = "claude"
tier     = "heavy"
roles    = ["design", "build"]
note     = "Opus - new awwwards sites + design systems"

[agents.claude2-design]
provider = "claude2"
tier     = "heavy"
roles    = ["design2", "build2"]
note     = "Opus on the personal (Max) account - 2nd concurrent design job"

[agents.codex-automation]
provider = "codex"
tier     = "heavy"
roles    = ["automation", "backend"]
note     = "Codex Sol - local Windows / VPS automations + backend"

[agents.claude-motion]
provider = "claude"
tier     = "heavy"
roles    = ["motion", "animation", "remotion"]
note     = "Opus - Remotion animations"

# --- standard tier: routine execution ---------------------------------------
[agents.claude-site]
provider = "claude"
tier     = "standard"
roles    = ["site-update", "media"]
note     = "Sonnet - update an existing site; generate images/video (higgsfield, magnific)"

[agents.codex-scrape]
provider = "codex"
tier     = "standard"
roles    = ["scrape", "data"]
note     = "Codex gpt-5.5 - data scraping"

# --- lite tier: bookkeeping --------------------------------------------------
[agents.pi-lite]
provider = "pi"
tier     = "lite"
roles    = ["docs", "vcs", "commit", "token-opt", "linking"]
note     = "GLM 5.2 - directive updates, commits, token optimization"

[agents.opencode-lite]
provider = "opencode"
tier     = "lite"
roles    = ["docs2", "vcs2", "commit2", "token-opt2", "linking2"]
note     = "GLM 5.2 on the Z.ai coding plan - 2nd concurrent lite job (mirrors pi-lite)"

# ----------------------------------------------------------------- capability
# (tier, provider) -> model + reasoning effort. The ONLY place model ids live.
#
# A tier lists the providers it supports. If an agent's provider is not in the
# tier, `default_provider` wins — that is the provider SWITCH. Example: a codex
# agent at `max` has no codex entry, so it lands on Claude/Fable. That is how
# "max is Fable-only" is enforced without the role having to know.
#
# Difficulty is exposed to humans as 1-10 but bucketed into these 4 real steps.
[capability]
ranges = { lite = "1-3", standard = "4-6", heavy = "7-9", max = "10" }

# lite — bookkeeping. Claude/Codex deliberately absent: lite work leaves the
# expensive providers entirely.
[capability.lite]
default_provider = "pi"

[capability.lite.pi]
model = "zai/glm-5.2"

[capability.lite.opencode]
model = "zai-coding-plan/glm-5.2"
# The Deepseek option needs the opencode gateway, which is unbilled:
#   model = "opencode/deepseek-v4-pro"   # unblock by adding billing at opencode.ai

# standard — routine execution.
[capability.standard]
default_provider = "claude"

[capability.standard.claude]
model = "sonnet"

[capability.standard.claude2]
model = "sonnet"

[capability.standard.codex]
model = "gpt-5.5"
extra_args = ["-c", "model_reasoning_effort=medium"]

# No opencode entry above lite, deliberately: its non-lite models all run on the
# unbilled gateway. An opencode agent at standard+ therefore switches to Claude
# rather than failing with "No payment method".

# heavy — generative production.
[capability.heavy]
default_provider = "claude"

[capability.heavy.claude]
model = "opus"

[capability.heavy.claude2]
model = "opus"

[capability.heavy.codex]
model = "gpt-5.6-sol"
extra_args = ["-c", "model_reasoning_effort=high"]

# max — frontier judgment. Fable only: pi/codex/opencode agents escalate to Claude here.
[capability.max]
default_provider = "claude"

[capability.max.claude]
model = "fable"

[capability.max.claude2]
model = "fable"

# ----------------------------------------------------------------- loop recipes
# Roles encode task TYPE; recipes encode a loop SHAPE (a cheap producer + an
# expensive judge, or a self-terminating single agent). `producer`/`verifier` are
# ROLES — the tier table picks their provider/model, so a recipe is cross-provider
# for free. Explicit `loop` flags override any field here. Omit `verifier` for a
# self-terminating loop (it then needs `until = "sentinel"`). See `routes` for the
# resolved producer/verifier -> provider/model of each recipe.
[loops.design-refine]
producer   = "design"        # Opus builds fast
verifier   = "design-qa"     # Fable judges hard
until      = "verifier"
max_iter   = 6
pass_score = 90
note       = "Opus builds, Fable QAs, until a11y + polish pass"

[loops.bug-hunt]
producer   = "backend"       # Codex Sol patches
verifier   = "review"        # Fable confirms the bug is truly gone
until      = "verifier"
max_iter   = 5
pass_score = 95
note       = "Codex fixes, Fable verifies the defect is gone"

[loops.doc-tighten]
producer   = "docs"          # GLM iterates cheaply
verifier   = "review"        # Fable gates quality once
until      = "verifier"
max_iter   = 4
note       = "GLM tightens cheaply, Fable gates once"

[loops.plan-sharpen]
producer   = "plan"          # single strong agent, self-terminating
until      = "sentinel"
max_iter   = 4
note       = "Fable sharpens a plan until it self-reports done (no separate judge)"
